<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>和合本</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
  <style>
    /* 閱讀頁專屬：只補 style.css 沒有的部分（樣本二「閱讀頁」）。
       超大章號、明體經文、行距 2、節號主色小字都在 style.css 的 .chap／.verses 裡。 */
    .reader {
      width: 100%;
    }

    .chap {
      flex-wrap: wrap;
    }

    .chap h1 {
      margin: 0;
      font-size: 1.375rem;
    }

    /* .panel 是 surface 白底：參照區改用霧白才分得出塊面 */
    .notes {
      background: var(--paper);
      border-radius: var(--r-md);
    }

    /* 節號欄：.verses 的 2.2em 是固定軌，舊的 3rem 寬會溢出壓到經文 */
    #verses .verse-num {
      width: auto;
      flex: none;
      margin-top: 0;
      padding-top: .95em;
      font-family: var(--body);
      font-size: .78rem;
      font-weight: 600;
      color: var(--river);
      text-align: left;
    }

    #verses .verse-text {
      font-size: inherit;
      line-height: 2;
    }

    /* 舊清單的底線不屬於新版面（樣本靠留白分節） */
    #verses li {
      border-bottom: 0;
    }

    #verses li:hover {
      background: var(--river-soft);
    }

    .chap-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5em 1em;
      border-top: 1px solid var(--line);
      padding-top: 1em;
    }

    .chap-nav h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: .1em;
      color: var(--muted);
    }

    .chap-nav .nav-list {
      gap: 6px;
    }
  </style>
</head>
<body>
  <nav id="nav"></nav>

  <main class="wrap">
    <article class="panel">
      <div class="reader">
        <header class="chap">
          <span class="num" id="chap-num">–</span>
          <div>
            <p class="eyebrow">共 <span id="chap-count">–</span> 節</p>
            <h1 id="title"></h1>
          </div>
        </header>

        <div id="book-tabs"></div>

        <p class="status" id="reading-status" role="status" aria-live="polite"></p>

        <ul id="verses" class="verse-list verses"></ul>

        <section class="notes" id="notes-area" hidden>
          <h3>參照</h3>
          <ul id="notes-list"></ul>
        </section>

        <nav class="chap-nav" aria-label="章節導航">
          <h2>章節導航</h2>
          <ul class="nav-list" id="chapter-links"></ul>
        </nav>
      </div>
    </article>
  </main>

  <footer id="footer"></footer>

  <script src="app.js"></script>
  <script>
    (function () {
      const key = Bible.bookKey(Bible.param("book"));
      let ch = parseInt(Bible.param("ch"), 10);
      if (!Number.isFinite(ch) || ch < 1) {
        ch = 1;
      }

      Bible.nav("chapter.html");
      Bible.bookTabs("book-tabs", key, "chapter.html");

      const list = document.getElementById("verses");
      const status = document.getElementById("reading-status");

      /* 收藏資料一有損壞就在頁面載入時講清楚：提示必須是看得見的葉節點，
         收在還沒展開的 chips 裡等於沒說。之後渲染完成不再蓋掉這句話。 */
      const bookmarkBroken = Bible.bookmarks.read().corrupted;
      if (bookmarkBroken) {
        Bible.say(status, "fix", "收藏資料損壞或無法讀取，已略過異常項目（可重新收藏）");
      } else {
        Bible.say(status, "busy", "正在載入經文…");
      }

      function addLink(container, label, href) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = href;
        a.textContent = label;
        li.appendChild(a);
        container.appendChild(li);
      }

      Bible.load(key).then(function (data) {
        if (!data || !Array.isArray(data.chapters)) {
          throw new Error("資料載入失敗");
        }
        const totalChapters = data.chapters.length;
        if (ch < 1 || ch > totalChapters) {
          ch = 1;
        }

        const chapter = Bible.chapterOf(data, ch);
        if (!chapter || !chapter.verses) {
          throw new Error("資料載入失敗");
        }

        document.getElementById("title").textContent = Bible.bookName(key) + " 第 " + ch + " 章";
        document.title = Bible.bookName(key) + " 第 " + ch + " 章";
        document.getElementById("chap-num").textContent = ch;
        document.getElementById("chap-count").textContent = chapter.verses.length;
        document.getElementById("footer").textContent = "和合本 · " + Bible.bookName(key);

        list.innerHTML = "";
        chapter.verses.forEach(function (v) {
          const li = document.createElement("li");
          li.id = "v" + v.v;

          const num = document.createElement("span");
          num.className = "verse-num";
          num.textContent = Bible.verseLabel(v);

          const text = document.createElement("span");
          text.className = "verse-text";
          text.textContent = v.text;

          li.appendChild(num);
          li.appendChild(text);

          if (v.end != null) {
            // 合併節的結尾錨點：留成有框格的元素，#vEnd 才捲得過去，也不擠歪經文左緣
            const anchor = document.createElement("span");
            anchor.id = "v" + v.end;
            li.appendChild(anchor);
          }

          list.appendChild(li);
        });

        const notesArea = document.getElementById("notes-area");
        const notesList = document.getElementById("notes-list");
        if (chapter.notes && chapter.notes.length > 0) {
          notesList.innerHTML = chapter.notes.map(function (n) {
            return "<li>" + Bible.escape(n) + "</li>";
          }).join("");
          notesArea.hidden = false;
        } else {
          notesArea.hidden = true;
        }

        const links = document.getElementById("chapter-links");
        links.innerHTML = "";
        if (ch > 1) {
          addLink(links, "上一章", "chapter.html?book=" + key + "&ch=" + (ch - 1));
        }
        addLink(links, "回到目錄", "index.html?book=" + key);
        if (ch < totalChapters) {
          addLink(links, "下一章", "chapter.html?book=" + key + "&ch=" + (ch + 1));
        }

        if (!bookmarkBroken) {
          Bible.say(status, "ok", "經文已載入");
        }

        const hash = location.hash;
        if (hash && hash.length > 1) {
          const targetId = hash.charAt(0) === "#" ? hash.slice(1) : hash;
          const el = document.getElementById(targetId);
          if (el) {
            el.scrollIntoView({ behavior: "auto", block: "center" });
          }
        }
      }).catch(function (err) {
        Bible.say(status, "fix", "經文載入失敗，請稍後再試");
        Bible.fail(document.querySelector("main"), err);
      });

      /* 點一節經文：標成目前節，給「做成經文卡片」與「收藏這一節」兩顆操作。
         收藏只寫座標進 localStorage（見 app.js 的 Bible.bookmarks），經文文字一律不存。 */
      const MARK_ON = "✓ 已收藏";
      const MARK_OFF = "收藏這一節";

      function markVerseOf(btn) {
        return Number(btn.getAttribute("data-v"));
      }

      function paintMark(btn) {
        const on = Bible.bookmarks.has(key, ch, markVerseOf(btn));
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.textContent = on ? MARK_ON : MARK_OFF;
      }

      list.addEventListener("click", function (event) {
        const btn = event.target.closest("[data-bookmark-btn]");
        if (btn) {
          const vNum = markVerseOf(btn);
          const res = Bible.bookmarks.toggle(key, ch, vNum);
          paintMark(btn);
          if (!res.saved) {
            Bible.say(status, "fix", "收藏無法寫入（本機儲存空間不可用），請重新整理後再試");
            return;
          }
          Bible.say(status, "ok",
            (res.added ? "已收藏 " : "已取消收藏 ") + Bible.bookName(key) + " " + ch + ":" + vNum + "（本機儲存）");
          return;
        }
        if (event.target.closest(".chips")) {
          return;
        }
        const li = event.target.closest("#verses li");
        if (!li || !li.id) {
          return;
        }
        const picked = list.querySelector("li.on");
        if (picked) {
          picked.classList.remove("on");
          const old = picked.querySelector(".chips");
          if (old) {
            old.remove();
          }
        }
        if (picked === li) {
          return;
        }
        li.classList.add("on");
        const vNum = Number(li.id.slice(1));
        const chips = document.createElement("div");
        chips.className = "chips";

        const a = document.createElement("a");
        a.className = "pill";
        a.href = "card.html?book=" + key + "&ch=" + ch + "&v=" + vNum;
        a.textContent = "做成經文卡片 →";
        chips.appendChild(a);

        const mark = document.createElement("button");
        mark.type = "button";
        mark.className = "pill keep";
        mark.setAttribute("data-bookmark-btn", "1");
        mark.setAttribute("data-v", String(vNum));
        paintMark(mark);
        chips.appendChild(mark);

        li.appendChild(chips);
      });
    })();
  </script>
</body>
</html>
