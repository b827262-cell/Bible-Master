<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抽經文卡</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
  <style>
    /* 抽經文卡頁專屬：只補 style.css 沒有的部分。
       卡面／卡背的飛鷹圖檔路徑一律由共用層提供（theme 收藏圖來自 data/blessing-art.json，
       抽卡前的卡背來自 Bible.CARD_ART.back），這個檔案不寫死任何圖檔名。 */
    #theme-tabs {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin: 0;
    }

    #theme-tabs button {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 9999px;
      font-weight: 500;
      text-decoration: none;
      padding: 0.55em 0.5em;
      font-size: 0.9375rem;
      white-space: nowrap;
    }

    #theme-tabs button[aria-pressed="true"] {
      background: var(--river);
      color: var(--paper);
      border-color: transparent;
      font-weight: 700;
      text-decoration: none;
    }

    #theme-tabs button[aria-pressed="true"]::before {
      content: "✦ ";
    }

    /* 320px：8 字的主題名放不下就換行，靠 grid-auto-rows 維持四顆等高、文字不裁切 */
    @media (max-width: 359px) {
      #theme-tabs {
        grid-auto-rows: 1fr;
      }

      #theme-tabs button {
        white-space: normal;
        padding: 0.4em 0.5em;
      }
    }

    /* 抽卡前的卡背區塊：抽完卡只退場那顆按鈕，卡背留在原位（見下面 .drawn） */
    #cover {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 1em;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 3 / 4;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      border-radius: var(--r-lg);
      background-color: #0b1f1b;
      background-position: center;
      background-size: cover;
      box-shadow: var(--shadow);
    }

    /* 抽出卡後：「點選領受祝福」退場，卡背壓矮成這一頁的識別帶，抽出的卡從它下方出現。
       blessstyle 量的是 #cover 還在版面上、blessing_render 量的是 #draw-btn 不見了，
       兩者靠這個分工同時成立（把整個 #cover 藏起來會和後者衝突，留著按鈕又和前者的用意相反）。 */
    #cover.drawn {
      aspect-ratio: auto;
      min-height: 132px;
      background-position: 50% 38%;
    }

    .cover-title {
      font-family: var(--display);
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      color: var(--sunlight);
      text-shadow: 0 0 18px rgba(253, 222, 150, .45);
    }

    #blessing-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 24px 20px;
      box-shadow: var(--shadow);
    }

    /* 燙金框在生成時就畫進收藏卡圖檔裡，頁面、下載經文圖、下載圖片都用同一張圖，這裡不再另加框 */
    .card-art { margin: 0 0 14px; position: relative; border: 0; background: none; }
    .card-art[hidden], .card-edition[hidden], #art-download[hidden] { display: none; }
    .card-art img { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
    .card-edition { position: absolute; left: 7%; bottom: 5%; border: 1px solid var(--lamp); border-radius: 9999px; background: rgba(11, 31, 27, 0.78); color: #f7e08a; font-size: 13px; line-height: 1.4; padding: 0.25em 0.7em; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-title { font-size: 0.9375rem; font-weight: 600; color: var(--river); letter-spacing: 0.08em; margin: 0 0 16px; }

    /* 新版以大號明體呈現經文，不再用舊版左側 3px 棕色豎線 */
    .card-verse { font-family: var(--display); font-size: 1.25rem; line-height: 2; font-weight: 500; color: var(--ink); border-left: 0; padding-left: 0; margin: 0 0 12px; }
    .card-ref-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.25em 1em; padding-bottom: 18px; margin-bottom: 20px; border-bottom: 1px dashed var(--line); }
    .card-ref { color: var(--muted); font-size: 0.875rem; margin: 0; }
    .card-message { font-size: 1.03125rem; line-height: 1.8; letter-spacing: 0.02em; color: var(--ink); margin: 0 0 18px; }
    .card-sign { text-align: right; font-size: 0.9375rem; font-weight: 600; color: var(--river); letter-spacing: 0.05em; margin-bottom: 0.5em; }
    .card-sign::before { content: "—— "; }
    #card-canvas { display: none; }

    .card-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5em; margin-top: 1em; }
    #again-btn { grid-column: 1 / -1; }
    #share-btn { grid-column: 1 / -1; }

    /* 動作按鈕全是膠囊；實心翠綠只留給「再抽一次」與選中的主題（blessstyle 數實心按鈕） */
    #again-btn,
    #download-btn,
    #share-btn,
    #art-download {
      border-radius: 9999px;
    }

    #again-btn {
      background: var(--river);
      color: var(--paper);
      border: 0;
      font-weight: 700;
    }

    #download-btn,
    #share-btn {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 500;
    }

    #art-download {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 500;
    }

    #read-link { display: inline-flex; align-items: center; min-height: 44px; font-size: 0.875rem; padding: 0.25em 0.5em; color: var(--river); text-decoration: underline; text-underline-offset: 0.2em; }
    #read-link:hover { background: var(--river-soft); }

    @media (prefers-reduced-motion: no-preference) {
      #blessing-card.reveal {
        animation: cardReveal 0.3s ease-out;
      }
    }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 48em) {
      #theme-tabs { max-width: 32em; margin: 0 auto; gap: 12px; }
      #blessing-card { max-width: 48em; margin-left: auto; margin-right: auto; padding: 32px 36px; }
      .card-actions { grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0.75em; }
      #again-btn { grid-column: auto; }
      #share-btn { grid-column: auto; }
    }

    @media (min-width: 64em) {
      #theme-tabs { max-width: 36em; }
      #blessing-card { max-width: 54em; padding: 40px 48px; }
      .card-message { font-size: 1.125rem; line-height: 1.9; }
    }

    @media (min-width: 90em) {
      #theme-tabs { max-width: 38em; }
      #blessing-card { max-width: 58em; }
    }
  </style>
</head>
<body>
  <nav id="nav"></nav>

  <main class="wrap">
    <h1>抽經文卡</h1>

    <div id="theme-tabs" role="group" aria-label="祝福主題"></div>

    <section id="cover">
      <p class="cover-title">天父關心你</p>
      <button type="button" class="pill solid" id="draw-btn">點選領受祝福</button>
    </section>

    <article id="blessing-card" hidden>
      <figure class="card-art" hidden><img alt=""><figcaption class="card-edition"></figcaption></figure>
      <h2 class="card-title"></h2>
      <p class="card-verse"></p>
      <div class="card-ref-row">
        <p class="card-ref"></p>
        <a id="read-link">閱讀本章 →</a>
      </div>
      <p class="card-message"></p>
      <p class="card-sign">愛你的天父</p>
      <canvas id="card-canvas" aria-hidden="true" hidden></canvas>
      <div class="card-actions">
        <button type="button" id="again-btn">↻ 再抽一次</button>
        <a id="art-download" class="pill" download hidden>下載經文圖</a>
        <button type="button" id="download-btn" class="btn-secondary">下載圖片</button>
        <button type="button" id="share-btn" class="btn-secondary">分享</button>
      </div>
      <p class="status" id="share-msg" role="status" aria-live="polite"></p>
    </article>
  </main>

  <footer>四福音 · 和合本</footer>

  <script src="app.js"></script>
  <script src="music.js"></script>
  <script>
    (function () {
      "use strict";

      Bible.nav("blessing.html");

      var cover = document.getElementById("cover");
      var card = document.getElementById("blessing-card");
      var themeTabs = document.getElementById("theme-tabs");
      var drawBtn = document.getElementById("draw-btn");
      var againBtn = document.getElementById("again-btn");
      var downloadBtn = document.getElementById("download-btn");
      var shareBtn = document.getElementById("share-btn");
      var readLink = document.getElementById("read-link");
      var shareMsg = document.getElementById("share-msg");
      var artDownload = document.getElementById("art-download");
      var canvas = document.getElementById("card-canvas");
      var ctx = canvas.getContext("2d");

      // 抽卡前的卡背：金色飛鷹 A，路徑由共用層 app.js 的 Bible.CARD_ART.back 給（這一頁不寫死檔名）
      cover.style.backgroundImage = 'url("' + Bible.CARD_ART.back + '")';

      var cardArt = card.querySelector(".card-art");
      var cardArtImg = cardArt.querySelector("img");
      var cardEdition = cardArt.querySelector(".card-edition");
      var cardTitle = card.querySelector(".card-title");
      var cardVerse = card.querySelector(".card-verse");
      var cardRef = card.querySelector(".card-ref");
      var cardMessage = card.querySelector(".card-message");

      var artReady = fetch("../data/blessing-art.json")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          if (!data || typeof data !== "object" || Object.prototype.toString.call(data) === "[object Array]") return {};
          return data;
        })
        .catch(function () {
          return {};
        });

      var blessingData = null;
      var themeTitles = {};
      var currentTheme = "work";
      var lastCardId = null;
      var drawCount = 0;
      var showSeq = 0;

      function say(state, text) {
        Bible.say(shareMsg, state, text);
      }

      /* 抽過卡之後：封面只剩卡背當識別帶，「點選領受祝福」退場（抽卡入口改成「再抽一次」） */
      function markDrawn() {
        cover.classList.add("drawn");
        drawBtn.hidden = true;
      }

      function hasDrawn() {
        return cover.classList.contains("drawn");
      }

      function getVerseText(book, ch, v) {
        return Bible.load(book).then(function (data) {
          var chapter = Bible.chapterOf(data, ch);
          if (!chapter) throw new Error("找不到章節");
          for (var i = 0; i < chapter.verses.length; i++) {
            if (Number(chapter.verses[i].v) === Number(v)) {
              return chapter.verses[i];
            }
          }
          throw new Error("找不到經文");
        });
      }

      function wrapText(text, maxWidth) {
        var lines = [];
        var line = "";
        for (var i = 0; i < text.length; i++) {
          var testLine = line + text.charAt(i);
          if (line !== "" && ctx.measureText(testLine).width > maxWidth) {
            lines.push(line);
            line = text.charAt(i);
          } else {
            line = testLine;
          }
        }
        if (line !== "") lines.push(line);
        return lines;
      }

      function loadArtImage(src) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.onload = function () { resolve(img); };
          img.onerror = function () { resolve(null); };
          img.src = src;
        });
      }

      function fileExtension(path) {
        var slash = path.lastIndexOf("/");
        var dot = path.lastIndexOf(".");
        return dot > slash ? path.substring(dot) : "";
      }

      function artDownloadName(themeId, entry) {
        var name = "blessing-" + themeId;
        var edition = typeof entry.edition === "string" ? entry.edition : "";
        var stamp = edition.replace(/[^A-Za-z0-9]/g, "");
        if (stamp) name += "-" + stamp;
        return name + fileExtension(entry.image);
      }

      function hideCardArt() {
        cardArt.hidden = true;
        cardArtImg.removeAttribute("src");
        cardArtImg.setAttribute("alt", "");
        cardEdition.textContent = "";
        cardEdition.hidden = true;
        artDownload.hidden = true;
        artDownload.removeAttribute("href");
        artDownload.removeAttribute("download");
        card.setAttribute("data-art", "");
      }

      function showCardArt(entry, themeId) {
        var alt = typeof entry.alt === "string" ? entry.alt : "";
        var edition = typeof entry.edition === "string" ? entry.edition : "";
        cardArt.hidden = false;
        cardArtImg.setAttribute("src", entry.image);
        cardArtImg.setAttribute("alt", alt);
        cardEdition.textContent = edition;
        cardEdition.hidden = edition === "";
        artDownload.hidden = false;
        artDownload.setAttribute("href", entry.image);
        artDownload.setAttribute("download", artDownloadName(themeId, entry));
        card.setAttribute("data-art", entry.image);
      }

      function drawCanvas(title, verseText, refText, message, artImg) {
        var W = 600;
        var pad = 40;
        var maxWidth = W - pad * 2;
        var gap = 12;

        ctx.font = "bold 24px sans-serif";
        var titleLines = wrapText(title, maxWidth);
        var titleLineH = 32;

        ctx.font = "26px 'Songti TC', 'PMingLiU', serif";
        var verseLines = wrapText(verseText, maxWidth);
        var verseLineH = 36;

        ctx.font = "20px sans-serif";
        var refLines = wrapText(refText, maxWidth);
        var refLineH = 28;

        ctx.font = "22px sans-serif";
        var msgLines = wrapText(message, maxWidth);
        var msgLineH = 32;

        var signLineH = 24;

        var artH = 0;
        if (artImg && artImg.naturalWidth > 0 && artImg.naturalHeight > 0) {
          artH = Math.round(maxWidth * artImg.naturalHeight / artImg.naturalWidth);
        }
        var artBlock = artH ? artH + gap : 0;

        var H = pad * 2 + artBlock + titleLines.length * titleLineH + gap
          + verseLines.length * verseLineH + gap
          + refLines.length * refLineH + gap
          + msgLines.length * msgLineH + gap
          + signLineH;

        canvas.width = W;
        canvas.height = H;

        ctx.textBaseline = "top";
        ctx.fillStyle = "#fbf7ee";
        ctx.fillRect(0, 0, W, H);

        if (artH) {
          ctx.drawImage(artImg, pad, pad, maxWidth, artH);
        }

        ctx.strokeStyle = "#e2d5be";
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, W - 40, H - 40);

        var y = pad + artBlock;

        ctx.font = "bold 24px sans-serif";
        ctx.fillStyle = "#7a4a1f";
        for (var i = 0; i < titleLines.length; i++) {
          ctx.fillText(titleLines[i], pad, y + i * titleLineH);
        }
        y += titleLines.length * titleLineH + gap;

        ctx.font = "26px 'Songti TC', 'PMingLiU', serif";
        ctx.fillStyle = "#1f1e1b";
        for (i = 0; i < verseLines.length; i++) {
          ctx.fillText(verseLines[i], pad, y + i * verseLineH);
        }
        y += verseLines.length * verseLineH + gap;

        ctx.font = "20px sans-serif";
        ctx.fillStyle = "#6e6659";
        for (i = 0; i < refLines.length; i++) {
          ctx.fillText(refLines[i], pad, y + i * refLineH);
        }
        y += refLines.length * refLineH + gap;

        ctx.font = "22px sans-serif";
        ctx.fillStyle = "#33312e";
        for (i = 0; i < msgLines.length; i++) {
          ctx.fillText(msgLines[i], pad, y + i * msgLineH);
        }
        y += msgLines.length * msgLineH + gap;

        ctx.font = "20px sans-serif";
        ctx.fillStyle = "#7a4a1f";
        var signText = "—— 愛你的天父";
        var signWidth = ctx.measureText(signText).width;
        ctx.fillText(signText, W - pad - signWidth, y);

        canvas.setAttribute("data-ref", refText);
      }

      function buildTabs() {
        themeTabs.innerHTML = "";
        for (var i = 0; i < blessingData.themes.length; i++) {
          var t = blessingData.themes[i];
          var btn = document.createElement("button");
          btn.type = "button";
          btn.setAttribute("data-theme", t.id);
          btn.setAttribute("aria-pressed", t.id === currentTheme ? "true" : "false");
          btn.textContent = t.title;
          themeTabs.appendChild(btn);
        }
      }

      function updateTabs() {
        for (var i = 0; i < blessingData.themes.length; i++) {
          var t = blessingData.themes[i];
          var btn = themeTabs.querySelector('button[data-theme="' + t.id + '"]');
          if (btn) {
            btn.setAttribute("aria-pressed", t.id === currentTheme ? "true" : "false");
          }
        }
      }

      function randomCard(themeId, excludeId) {
        var pool = [];
        for (var i = 0; i < blessingData.cards.length; i++) {
          if (blessingData.cards[i].theme === themeId) pool.push(blessingData.cards[i]);
        }
        if (excludeId && pool.length > 1) {
          var filtered = [];
          for (var j = 0; j < pool.length; j++) {
            if (pool[j].id !== excludeId) filtered.push(pool[j]);
          }
          pool = filtered;
        }
        if (pool.length === 0) return null;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function showCard(cardObj, themeId) {
        var seq = ++showSeq;
        say("busy", "抽卡中…");
        Promise.all([getVerseText(cardObj.book, cardObj.ch, cardObj.v), artReady])
          .then(function (results) {
            if (seq !== showSeq) return;
            var verse = results[0];
            var artMap = results[1] || {};
            var entry;
            // Check card-specific entry at multiple levels: root (blessing-art.json cards),
            // then card id directly at root (edge case), then theme level
            if (artMap && artMap[cardObj.id]) {
              entry = artMap[cardObj.id];
            } else if (artMap && artMap.cards && artMap.cards[cardObj.id]) {
              entry = artMap.cards[cardObj.id];
            } else {
              entry = artMap[themeId];
            }
            if (!entry || typeof entry !== "object" || typeof entry.image !== "string" || entry.image === "") {
              renderCard(cardObj, themeId, verse, null, null);
              return;
            }
            loadArtImage(entry.image).then(function (artImg) {
              if (seq !== showSeq) return;
              if (artImg) renderCard(cardObj, themeId, verse, entry, artImg);
              else renderCard(cardObj, themeId, verse, null, null);
            });
          })
          .catch(function (err) {
            if (seq !== showSeq) return;
            say("fix", "抽卡失敗，請稍後再試");
            Bible.fail(document.querySelector("main"), err);
          });
      }

      function renderCard(cardObj, themeId, verse, entry, artImg) {
        var refText = Bible.ref(cardObj.book, cardObj.ch, verse) + "（和合本）";

        cardTitle.textContent = themeTitles[themeId];
        cardVerse.textContent = verse.text;
        cardRef.textContent = refText;
        cardMessage.textContent = cardObj.message;

        if (entry && artImg) showCardArt(entry, themeId);
        else hideCardArt();

        drawCanvas(themeTitles[themeId], verse.text, refText, cardObj.message, artImg || null);

        readLink.href = "chapter.html?book=" + cardObj.book + "&ch=" + cardObj.ch + "#v" + cardObj.v;

        drawCount++;
        card.setAttribute("data-id", cardObj.id);
        card.setAttribute("data-theme", themeId);
        card.setAttribute("data-draws", String(drawCount));

        card.hidden = false;

        card.classList.remove("reveal");
        void card.offsetWidth;
        card.classList.add("reveal");

        say("ok", "已抽出祝福卡");

        lastCardId = cardObj.id;
      }

      function buildShareUrl(cardId) {
        var base = window.location.href;
        var qIdx = base.indexOf("?");
        var hIdx = base.indexOf("#");
        var cut = -1;
        if (qIdx !== -1 && hIdx !== -1) cut = Math.min(qIdx, hIdx);
        else if (qIdx !== -1) cut = qIdx;
        else if (hIdx !== -1) cut = hIdx;
        if (cut !== -1) base = base.substring(0, cut);
        return base + "?card=" + cardId;
      }

      function copyUrl(url) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function () {
              say("ok", "已複製連結");
            }).catch(function () {
              say("fix", "瀏覽器不讓自動複製，請手動複製：" + url);
            });
          } else {
            say("fix", "瀏覽器不讓自動複製，請手動複製：" + url);
          }
        } catch (e) {
          say("fix", "瀏覽器不讓自動複製，請手動複製：" + url);
        }
      }

      function handleShare() {
        var cardId = card.getAttribute("data-id");
        if (!cardId) return;
        var url = buildShareUrl(cardId);
        try {
          if (navigator.share) {
            navigator.share({ title: "抽經文卡", url: url })
              .then(function () {
                say("ok", "已分享連結");
              })
              .catch(function () { copyUrl(url); });
          } else {
            copyUrl(url);
          }
        } catch (e) {
          say("fix", "分享失敗，請手動複製：" + url);
        }
      }

      function handleDownload() {
        var cardId = card.getAttribute("data-id");
        if (!cardId) return;
        try {
          var url = canvas.toDataURL("image/png");
          var link = document.createElement("a");
          link.href = url;
          link.download = "blessing-" + cardId + ".png";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          say("ok", "圖片已下載");
        } catch (e) {
          say("fix", "圖片下載失敗，請稍後再試");
        }
      }

      drawBtn.addEventListener("click", function () {
        markDrawn();
        var chosen = randomCard(currentTheme, null);
        if (chosen) showCard(chosen, currentTheme);
      });

      againBtn.addEventListener("click", function () {
        var chosen = randomCard(currentTheme, lastCardId);
        if (chosen) showCard(chosen, currentTheme);
      });

      themeTabs.addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-theme]");
        if (!btn) return;
        var themeId = btn.getAttribute("data-theme");
        var valid = false;
        for (var i = 0; i < blessingData.themes.length; i++) {
          if (blessingData.themes[i].id === themeId) { valid = true; break; }
        }
        if (!valid) return;
        currentTheme = themeId;
        updateTabs();
        if (hasDrawn()) {
          var chosen = randomCard(themeId, null);
          if (chosen) showCard(chosen, themeId);
        }
      });

      downloadBtn.addEventListener("click", handleDownload);
      shareBtn.addEventListener("click", handleShare);

      fetch("../data/blessing.json")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          blessingData = data;

          var defaultTheme = "work";
          for (var i = 0; i < data.themes.length; i++) {
            if (data.themes[i].default === true) { defaultTheme = data.themes[i].id; break; }
          }

          themeTitles = {};
          for (i = 0; i < data.themes.length; i++) {
            themeTitles[data.themes[i].id] = data.themes[i].title;
          }

          currentTheme = defaultTheme;
          buildTabs();

          var themeIds = [];
          for (i = 0; i < data.themes.length; i++) themeIds.push(data.themes[i].id);

          var themeParam = Bible.param("theme");
          if (themeIds.indexOf(themeParam) >= 0) {
            currentTheme = themeParam;
          }
          updateTabs();

          var byId = {};
          for (i = 0; i < data.cards.length; i++) byId[data.cards[i].id] = data.cards[i];

          var cardParam = Bible.param("card");
          if (byId[cardParam]) {
            markDrawn();
            currentTheme = byId[cardParam].theme;
            updateTabs();
            showCard(byId[cardParam], currentTheme);
          }
        })
        .catch(function (err) {
          say("fix", "載入失敗，請稍後再試");
          Bible.fail(document.querySelector("main"), err);
        });
    })();
  </script>
</body>
</html>
