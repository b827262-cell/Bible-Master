<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四福音（和合本）</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <nav id="nav"></nav>

  <main class="container">
    <p><a href="home.html">← 回首頁</a></p>
    <h1>四福音（和合本）</h1>
    <p>四福音全文，共四卷。點選章節閱讀全文，或搜尋經文內容。</p>
    <p><a href="blessing.html">抽一張經文卡，領受今天的祝福 →</a></p>

    <div id="book-tabs"></div>

    <form method="get" action="search.html" class="search-form">
      <input type="search" name="q" placeholder="搜尋經文內容" aria-label="搜尋關鍵字">
      <select name="book" id="search-book" aria-label="搜尋範圍">
        <option value="all">全部四卷</option>
      </select>
      <button type="submit">搜尋</button>
    </form>

    <div class="chapter-grid" id="chapters"></div>
  </main>

  <footer>四福音 · 和合本</footer>

  <script src="app.js"></script>
  <script>
    (function () {
      Bible.nav("index.html");

      const key = Bible.bookKey(Bible.param("book"));
      Bible.bookTabs("book-tabs", key, "index.html");

      // Initialize the book select dropdown with all options
      const select = document.getElementById("search-book");
      select.innerHTML = "";
      select.add(new Option("全部四卷", "all"));
      Bible.BOOKS.forEach(function (book) {
        select.add(new Option(book.name, book.key));
      });
      select.value = Bible.bookKey(Bible.param("book"));

      Bible.load(key).then(function (data) {
        const grid = document.getElementById("chapters");
        data.chapters.forEach(function (chapter) {
          const a = document.createElement("a");
          a.className = "chapter-card";
          a.href = "chapter.html?book=" + key + "&ch=" + chapter.ch;

          const title = document.createElement("span");
          title.className = "ch-title";
          title.textContent = "第 " + chapter.ch + " 章";

          const count = document.createElement("span");
          count.className = "ch-count";
          count.textContent = "・" + chapter.verses.length + " 節";

          a.appendChild(title);
          a.appendChild(count);
          grid.appendChild(a);
        });
      }).catch(function (err) {
        Bible.fail(document.querySelector("main"), err);
      });
    })();
  </script>
</body>
</html>
