<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>經文卡片</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
  <style>
    /* 經文卡片頁專屬：只補 style.css 沒有的部分。卡面飛鷹圖由 Bible.CARD_ART.face（app.js）
       提供路徑，這裡不寫死檔名；畫布自帶高對比文字底板，頁面只負責排版。 */
    .card-controls {
      display: flex;
      gap: 1em;
      margin: 0 0 1em;
      flex-wrap: wrap;
    }

    .card-controls label {
      display: flex;
      flex-direction: column;
      gap: 0.25em;
      font-size: 0.9em;
      color: var(--muted);
    }

    .card-controls select {
      padding: 0.4em 0.6em;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 1em;
    }

    #card-status {
      margin: 0 0 1em;
    }

    #card-canvas {
      width: 100%;
      max-width: 560px;
      height: auto;
      display: block;
      margin: 0 auto 1em;
      border-radius: var(--r-md);
      box-shadow: var(--shadow);
    }

    #download-btn {
      display: block;
      margin: 0 auto;
      min-width: 180px;
    }

    @media (min-width: 48em) {
      .card-controls {
        justify-content: center;
        gap: 1.5em;
      }
    }
  </style>
</head>
<body>
  <nav id="nav"></nav>

  <main class="wrap">
    <h1>經文卡片</h1>

    <section class="panel">
      <div class="card-controls">
        <label>書卷
          <select id="book-select"></select>
        </label>
        <label>章
          <select id="ch-select"></select>
        </label>
        <label>節
          <select id="v-select"></select>
        </label>
      </div>

      <p class="status" id="card-status" role="status" aria-live="polite"></p>

      <canvas id="card-canvas"></canvas>

      <button type="button" class="pill solid" id="download-btn">下載圖片</button>
    </section>
  </main>

  <footer>四福音 · 和合本</footer>

  <script src="app.js"></script>
  <script src="music.js"></script>
  <script>
    (function () {
      Bible.nav("card.html");

      const bookSelect = document.getElementById("book-select");
      const chSelect = document.getElementById("ch-select");
      const vSelect = document.getElementById("v-select");
      const canvas = document.getElementById("card-canvas");
      const ctx = canvas.getContext("2d");
      const downloadBtn = document.getElementById("download-btn");
      const statusEl = document.getElementById("card-status");

      const VERSE_FONT = '30px "Noto Serif TC", "Songti TC", "PMingLiU", serif';
      const REF_FONT = '19px system-ui, "PingFang TC", "Noto Sans TC", sans-serif';
      const INK = "#10231f";
      const RIVER = "#0e6b5b";

      let data = null;
      let book = "mat";
      let ch = 1;
      let v = 1;

      function findChapter(c) {
        if (!data || !Array.isArray(data.chapters)) return null;
        for (let i = 0; i < data.chapters.length; i++) {
          if (Number(data.chapters[i].ch) === Number(c)) return data.chapters[i];
        }
        return null;
      }

      function findVerse(verses, v) {
        for (let i = 0; i < verses.length; i++) {
          if (Number(verses[i].v) === Number(v)) return verses[i];
        }
        return null;
      }

      function fillBookSelect() {
        bookSelect.innerHTML = "";
        for (let i = 0; i < Bible.BOOKS.length; i++) {
          const bk = Bible.BOOKS[i];
          const opt = document.createElement("option");
          opt.value = bk.key;
          opt.textContent = bk.name;
          bookSelect.appendChild(opt);
        }
      }

      function fillChapterSelect() {
        chSelect.innerHTML = "";
        if (!data) return;
        const numChapters = data.chapters.length;
        for (let i = 1; i <= numChapters; i++) {
          const opt = document.createElement("option");
          opt.value = String(i);
          opt.textContent = "第 " + i + " 章";
          chSelect.appendChild(opt);
        }
      }

      function fillVerseSelect() {
        vSelect.innerHTML = "";
        const chapter = findChapter(ch);
        if (!chapter) return;
        for (let i = 0; i < chapter.verses.length; i++) {
          const vv = chapter.verses[i];
          const opt = document.createElement("option");
          opt.value = vv.v;
          opt.textContent = Bible.verseLabel(vv);
          vSelect.appendChild(opt);
        }
      }

      function wrapText(text, maxWidth) {
        const lines = [];
        let line = "";
        for (let i = 0; i < text.length; i++) {
          const testLine = line + text.charAt(i);
          if (line !== "" && ctx.measureText(testLine).width > maxWidth) {
            lines.push(line);
            line = text.charAt(i);
          } else {
            line = testLine;
          }
        }
        if (line !== "") lines.push(line);
        return lines;
      }

      function say(state, text) {
        if (state) {
          statusEl.setAttribute("data-state", state);
        } else {
          statusEl.removeAttribute("data-state");
        }
        statusEl.textContent = text;
      }

      /* 卡面：飛鷹 B 铺滿整張卡（等比裁切，不壓扁），下方壓一塊高對比白底板放經文與出處。
         圖還沒載入（或載入失敗）時照樣畫底色與文字：data-ref 一律先設好，不等圖片。 */
      function drawCard() {
        const chapter = findChapter(ch);
        const verse = chapter ? findVerse(chapter.verses, v) : null;
        if (!verse) return;

        const text = verse.text;
        const refText = Bible.ref(book, ch, verse) + "（和合本）";
        canvas.setAttribute("data-ref", refText);

        const W = 600;
        const side = 40;
        const plateInner = 28;
        const topArt = 170;
        const bottom = 44;
        const gap = 12;
        const verseLine = 46;
        const refLine = 26;
        const innerWidth = W - side * 2 - plateInner * 2;

        ctx.font = VERSE_FONT;
        const textLines = wrapText(text, innerWidth);
        ctx.font = REF_FONT;
        const refLines = wrapText(refText, innerWidth);
        const plateH = plateInner * 2 + textLines.length * verseLine + gap + refLines.length * refLine;
        const H = topArt + plateH + bottom;

        canvas.width = W;
        canvas.height = H;
        ctx.textBaseline = "top";

        ctx.fillStyle = "#f3f6f2";
        ctx.fillRect(0, 0, W, H);

        if (faceArt && faceArt.complete && faceArt.naturalWidth > 0) {
          const scale = Math.max(W / faceArt.naturalWidth, H / faceArt.naturalHeight);
          const dw = faceArt.naturalWidth * scale;
          const dh = faceArt.naturalHeight * scale;
          ctx.drawImage(faceArt, (W - dw) / 2, (H - dh) / 2, dw, dh);
        }

        ctx.fillStyle = "rgba(255, 255, 255, .93)";
        ctx.strokeStyle = "rgba(201, 138, 27, .9)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(side, topArt, W - side * 2, plateH, 20);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = INK;
        ctx.font = VERSE_FONT;
        for (let i = 0; i < textLines.length; i++) {
          ctx.fillText(textLines[i], side + plateInner, topArt + plateInner + i * verseLine);
        }

        ctx.fillStyle = RIVER;
        ctx.font = REF_FONT;
        const refTop = topArt + plateInner + textLines.length * verseLine + gap;
        for (let i = 0; i < refLines.length; i++) {
          ctx.fillText(refLines[i], side + plateInner, refTop + i * refLine);
        }

        say("ok", "已產生：" + Bible.ref(book, ch, verse));
      }

      const faceArt = new Image();
      faceArt.onload = function () {
        drawCard();
      };
      faceArt.onerror = function () {
        /* 卡面圖載入失敗：經文卡照樣以底色產生，不打斷預覽與下載 */
      };
      faceArt.src = Bible.CARD_ART.face;

      function downloadImage() {
        try {
          const url = canvas.toDataURL("image/png");
          const link = document.createElement("a");
          link.href = url;
          link.download = book + "-" + ch + "-" + v + ".png";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          say("ok", "圖片已下載");
        } catch (err) {
          say("fix", "載入失敗，請稍後再試");
        }
      }

      function applySelection() {
        bookSelect.value = book;
        chSelect.value = String(ch);
        fillVerseSelect();
        vSelect.value = String(v);
        drawCard();
      }

      chSelect.addEventListener("change", function () {
        const val = parseInt(chSelect.value, 10);
        if (Number.isFinite(val) && val >= 1) {
          ch = val;
          v = 1;
          say("busy", "正在產生經文卡片…");
          applySelection();
        }
      });

      vSelect.addEventListener("change", function () {
        const val = parseInt(vSelect.value, 10);
        if (Number.isFinite(val)) {
          v = val;
          say("busy", "正在產生經文卡片…");
          drawCard();
        }
      });

      bookSelect.addEventListener("change", function () {
        const selectedBookKey = bookSelect.value;
        say("busy", "正在產生經文卡片…");
        Bible.load(selectedBookKey).then(function (loaded) {
          data = loaded;
          book = selectedBookKey;
          ch = 1;
          v = 1;
          fillChapterSelect();
          applySelection();
        }).catch(function (err) {
          say("fix", "載入失敗，請稍後再試");
          Bible.fail(document.querySelector("main"), err);
        });
      });

      downloadBtn.addEventListener("click", downloadImage);

      fillBookSelect();

      const rawBook = Bible.param("book");
      const rawCh = Bible.param("ch");
      const rawV = Bible.param("v");
      book = Bible.bookKey(rawBook);

      say("busy", "正在產生經文卡片…");
      Bible.load(book).then(function (loaded) {
        data = loaded;

        let urlCh = parseInt(rawCh, 10);
        if (!Number.isFinite(urlCh) || urlCh < 1 || urlCh > data.chapters.length) {
          urlCh = 1;
        }
        ch = urlCh;

        const chapter = findChapter(ch);
        let urlV = parseInt(rawV, 10);
        if (!chapter || !Number.isFinite(urlV) || urlV < 1 || !findVerse(chapter.verses, urlV)) {
          urlV = 1;
        }
        v = urlV;

        fillChapterSelect();
        applySelection();
      }).catch(function (err) {
        say("fix", "載入失敗，請稍後再試");
        Bible.fail(document.querySelector("main"), err);
      });
    })();
  </script>
</body>
</html>
