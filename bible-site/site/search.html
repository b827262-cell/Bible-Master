<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>經文搜尋 · 四福音（和合本）</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
  <style>
    /* 搜尋頁專屬：只補 style.css 沒有的部分。.panel 是 surface 白底，
       控件與結果卡改用霧白才分得出塊面；記號底色兩套色都要撐得起對比。 */
    .panel input[type="search"],
    .panel select {
      background: var(--paper);
    }

    .search-results {
      margin: 0;
    }

    .search-results li {
      border-radius: var(--r-md);
    }

    #result-info {
      margin: 0;
    }

    mark {
      background: var(--river-soft);
      color: var(--ink);
      border-radius: 4px;
      padding: 0 3px;
    }
  </style>
</head>
<body>
  <nav id="nav"></nav>

  <main class="wrap">
    <h1>經文搜尋</h1>

    <section class="panel">
      <form method="get" action="search.html" class="search-form" id="search-form" role="search">
        <input type="search" name="q" id="search-q" placeholder="輸入想找的字句，例如：重生" aria-label="搜尋關鍵字" aria-describedby="result-info">
        <select name="book" id="search-book" aria-label="搜尋範圍"></select>
        <button type="submit" class="pill solid" id="search-btn">搜尋</button>
      </form>
    </section>

    <p class="status" id="result-info" role="status" aria-live="polite"></p>
    <ul class="search-results" id="results"></ul>
  </main>

  <footer>四福音 · 和合本</footer>

  <script src="app.js"></script>
  <script src="music.js"></script>
  <script>
    (function () {
      Bible.nav("search.html");

      const form = document.getElementById("search-form");
      const input = document.getElementById("search-q");
      const bookSelect = document.getElementById("search-book");
      const searchBtn = document.getElementById("search-btn");
      const infoEl = document.getElementById("result-info");
      const resultsEl = document.getElementById("results");

      const IDLE_HINT = "輸入字句，在四福音裡找相同詞句的經文。";

      /* 下拉：先放「全部四卷」(value=all)，再用 Bible.BOOKS 迴圈產生四卷。 */
      function buildBookOptions() {
        bookSelect.innerHTML = "";
        const allOpt = document.createElement("option");
        allOpt.value = "all";
        allOpt.textContent = "全部四卷";
        bookSelect.appendChild(allOpt);
        Bible.BOOKS.forEach(function (book) {
          const opt = document.createElement("option");
          opt.value = book.key;
          opt.textContent = book.name;
          bookSelect.appendChild(opt);
        });
      }

      /* 網址的 book：all 或四卷 key 之一就回傳它；沒帶或不合法就回傳 "all"。 */
      function resolveBook(raw) {
        if (raw === "all") {
          return "all";
        }
        for (var i = 0; i < Bible.BOOKS.length; i++) {
          if (Bible.BOOKS[i].key === raw) {
            return raw;
          }
        }
        return "all";
      }

      /* 先跳脫經文與關鍵字，再用 <mark> 標出關鍵字。 */
      function highlight(text, q) {
        const escText = Bible.escape(text);
        const escQ = Bible.escape(q);
        return escText.split(escQ).join("<mark>" + escQ + "</mark>");
      }

      /* 單筆結果：出處用 Bible.ref，連到 chapter.html?book=KEY&ch=N#vV，後接經文。 */
      function renderResult(bookKey, ch, verse, q) {
        const li = document.createElement("li");

        const a = document.createElement("a");
        a.className = "search-ref";
        a.href = "chapter.html?book=" + bookKey + "&ch=" + ch + "#v" + verse.v;
        a.textContent = Bible.ref(bookKey, ch, verse);

        const span = document.createElement("span");
        span.innerHTML = highlight(verse.text, q);

        li.appendChild(a);
        li.appendChild(span);
        return li;
      }

      function say(state, text) {
        if (state) {
          infoEl.setAttribute("data-state", state);
        } else {
          infoEl.removeAttribute("data-state");
        }
        infoEl.textContent = text;
      }

      /* 待修正：欄位虛線粗框＋「怎麼修」的文字，結果清空。 */
      function needFix(text) {
        searchBtn.removeAttribute("aria-busy");
        input.setAttribute("aria-invalid", "true");
        say("fix", text);
        resultsEl.innerHTML = "";
      }

      function collect(data, key, q) {
        const found = [];
        const chapters = Array.isArray(data.chapters) ? data.chapters : [];
        chapters.forEach(function (chapter) {
          (chapter.verses || []).forEach(function (v) {
            if (v.text.indexOf(q) !== -1) {
              found.push({ key: key, ch: chapter.ch, verse: v });
            }
          });
        });
        return found;
      }

      function runSearch(q, book) {
        input.removeAttribute("aria-invalid");
        searchBtn.setAttribute("aria-busy", "true");
        say("busy", "搜尋中…");

        const useAll = (book === "all");
        const promise = useAll ? Bible.loadAll() : Bible.load(book);

        promise.then(function (data) {
          let matches = [];
          if (useAll) {
            /* 依 BOOKS 順序（mat、mrk、luk、jhn），各卷章序、節序。 */
            data.forEach(function (bookData, idx) {
              matches = matches.concat(collect(bookData, Bible.BOOKS[idx].key, q));
            });
          } else {
            matches = collect(data, book, q);
          }

          searchBtn.removeAttribute("aria-busy");
          resultsEl.innerHTML = "";

          if (matches.length === 0) {
            needFix("找不到「" + q + "」，請換個字句再試一次");
            return;
          }

          say("ok", "找到 " + matches.length + " 節（共 " + matches.length + " 筆）");
          matches.forEach(function (m) {
            resultsEl.appendChild(renderResult(m.key, m.ch, m.verse, q));
          });
        }).catch(function (err) {
          Bible.fail(document.querySelector("main"), err);
        });
      }

      buildBookOptions();

      const params = new URLSearchParams(window.location.search);
      const bookParam = resolveBook(Bible.param("book"));
      const q0 = Bible.param("q");
      input.value = q0;
      bookSelect.value = bookParam;

      if (params.has("q")) {
        if (q0.trim() === "") {
          needFix("請先輸入要找的字句");
        } else {
          runSearch(q0.trim(), bookParam);
        }
      } else {
        say("", IDLE_HINT);
      }

      input.addEventListener("input", function () {
        input.removeAttribute("aria-invalid");
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const q = input.value.trim();
        const book = bookSelect.value;
        window.history.replaceState({}, "", "search.html?q=" + encodeURIComponent(q) + "&book=" + book);
        if (q === "") {
          needFix("請先輸入要找的字句");
          input.focus();
          return;
        }
        runSearch(q, book);
      });
    })();
  </script>
</body>
</html>
