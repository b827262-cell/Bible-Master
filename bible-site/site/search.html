<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>經文搜尋 · 四福音（和合本）</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <nav id="nav"></nav>

  <main class="container">
    <h1>經文搜尋</h1>

    <form method="get" action="search.html" class="search-form">
      <input type="search" name="q" id="search-q" placeholder="輸入關鍵字" aria-label="搜尋關鍵字">
      <select name="book" id="search-book" aria-label="搜尋範圍"></select>
      <button type="submit">搜尋</button>
    </form>

    <p id="result-info"></p>
    <ul class="search-results" id="results"></ul>
  </main>

  <footer>四福音 · 和合本</footer>

  <script src="app.js"></script>
  <script>
    (function () {
      Bible.nav("search.html");

      const input = document.getElementById("search-q");
      const bookSelect = document.getElementById("search-book");
      const infoEl = document.getElementById("result-info");
      const resultsEl = document.getElementById("results");

      /* 下拉：先放「全部四卷」(value=all)，再用 Bible.BOOKS 迴圈產生四卷。 */
      function buildBookOptions() {
        bookSelect.innerHTML = "";
        const allOpt = document.createElement("option");
        allOpt.value = "all";
        allOpt.textContent = "全部四卷";
        bookSelect.appendChild(allOpt);
        Bible.BOOKS.forEach(function (book) {
          const opt = document.createElement("option");
          opt.value = book.key;
          opt.textContent = book.name;
          bookSelect.appendChild(opt);
        });
      }

      /* 網址的 book：all 或四卷 key 之一就回傳它；沒帶或不合法就回傳 "all"。 */
      function resolveBook(raw) {
        if (raw === "all") {
          return "all";
        }
        for (var i = 0; i < Bible.BOOKS.length; i++) {
          if (Bible.BOOKS[i].key === raw) {
            return raw;
          }
        }
        return "all";
      }

      /* 先跳脫經文與關鍵字，再用 <mark> 標出關鍵字。 */
      function highlight(text, q) {
        const escText = Bible.escape(text);
        const escQ = Bible.escape(q);
        return escText.split(escQ).join("<mark>" + escQ + "</mark>");
      }

      /* 單筆結果：出處用 Bible.ref，連到 chapter.html?book=KEY&ch=N#vV，後接經文。 */
      function renderResult(bookKey, ch, verse, q) {
        const li = document.createElement("li");

        const a = document.createElement("a");
        a.className = "search-ref";
        a.href = "chapter.html?book=" + bookKey + "&ch=" + ch + "#v" + verse.v;
        a.textContent = Bible.ref(bookKey, ch, verse);

        const span = document.createElement("span");
        span.innerHTML = highlight(verse.text, q);

        li.appendChild(a);
        li.appendChild(span);
        return li;
      }

      function search(q, book) {
        if (!q) {
          infoEl.textContent = "請輸入關鍵字，搜尋經文內容。";
          resultsEl.innerHTML = "";
          return;
        }

        const useAll = (book === "all");
        const promise = useAll ? Bible.loadAll() : Bible.load(book);

        promise.then(function (data) {
          const matches = [];

          if (useAll) {
            /* 依 BOOKS 順序（mat、mrk、luk、jhn），各卷章序、節序。 */
            data.forEach(function (bookData, idx) {
              const key = Bible.BOOKS[idx].key;
              bookData.chapters.forEach(function (chapter) {
                chapter.verses.forEach(function (v) {
                  if (v.text.indexOf(q) !== -1) {
                    matches.push({ key: key, ch: chapter.ch, verse: v });
                  }
                });
              });
            });
          } else {
            data.chapters.forEach(function (chapter) {
              chapter.verses.forEach(function (v) {
                if (v.text.indexOf(q) !== -1) {
                  matches.push({ key: book, ch: chapter.ch, verse: v });
                }
              });
            });
          }

          resultsEl.innerHTML = "";
          if (matches.length === 0) {
            infoEl.textContent = "找不到符合的經文";
            return;
          }

          infoEl.textContent = "共 " + matches.length + " 筆";
          matches.forEach(function (m) {
            resultsEl.appendChild(renderResult(m.key, m.ch, m.verse, q));
          });
        }).catch(function (err) {
          Bible.fail(document.querySelector("main"), err);
        });
      }

      buildBookOptions();

      const bookParam = resolveBook(Bible.param("book"));
      const q0 = Bible.param("q");
      input.value = q0;
      bookSelect.value = bookParam;

      if (q0 !== "") {
        search(q0, bookParam);
      } else {
        infoEl.textContent = "請輸入關鍵字，搜尋經文內容。";
      }
    })();
  </script>
</body>
</html>
