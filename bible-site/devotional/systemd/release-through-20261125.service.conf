# 截止日護欄：以 Asia/Taipei 的實際日期判斷，超過 2026-11-25 就不執行發佈。
# 安裝位置（PM 手動、安全新增，不覆蓋既有檔）：
#   ~/.config/systemd/user/bible-devotional-publish.service.d/release-through-20261125.conf
#
# ExecCondition 會在既有 ExecStart（git fetch/checkout 與 publish_daily.py）之前執行，
# 因此即使 Persistent=true 在 11/26 之後補跑 11/25 的排程，也不會公開越界日期。
# 截止日當天（11/25）回 0 照常發佈；11/26 起回 1，systemd 視為條件不符而跳過。
[Service]
ExecCondition=/usr/bin/python3 -c 'import datetime, sys; from zoneinfo import ZoneInfo; d = datetime.datetime.now(ZoneInfo("Asia/Taipei")).date(); print(f"devotional release skipped: Taipei date {d} is after 2026-11-25", file=sys.stderr) if d > datetime.date(2026, 11, 25) else None; sys.exit(0 if d <= datetime.date(2026, 11, 25) else 1)'
