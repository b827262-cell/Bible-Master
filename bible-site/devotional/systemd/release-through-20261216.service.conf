# 截止日護欄：以 Asia/Taipei 的實際日期判斷，超過 2026-12-16 就不執行發佈。
# 安裝位置（PM 手動、安全新增，不覆蓋既有檔）：
#   ~/.config/systemd/user/bible-devotional-publish.service.d/release-through-20261216.conf
#
# 檔名排序在舊的 release-through-20261125.conf 之後；先清空舊 11/25 的 ExecCondition，
# 避免兩條條件 AND 在 11/25 提前截止；再只保留新的 12/16 日期條件。
# 舊 11/25 模板與安裝檔保留，不刪除；原 ExecStart 與 host.conf 不動。
[Service]
ExecCondition=
ExecCondition=/usr/bin/python3 -c 'import datetime, sys; from zoneinfo import ZoneInfo; d = datetime.datetime.now(ZoneInfo("Asia/Taipei")).date(); print(f"devotional release skipped: Taipei date {d} is after 2026-12-16", file=sys.stderr) if d > datetime.date(2026, 12, 16) else None; sys.exit(0 if d <= datetime.date(2026, 12, 16) else 1)'
