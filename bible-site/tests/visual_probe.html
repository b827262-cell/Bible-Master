<!doctype html>
<meta charset="utf-8">
<!-- Loaded by tests/visual_checks.py. Opens ?u=<page> in one iframe per width in ?w=320,375,... and writes one JSON line:
     VISUAL {"<width>": {...measurements...}, ...}
     Measurements: horizontal overflow, touch-target sizes, keyboard focus outline, text contrast, current-page cues,
     heading sizes, verse alignment, form-control names and the number of rules the browser kept from style.css. -->
<pre id="out">running</pre>
<script>
const qs = new URLSearchParams(location.search);
const widths = (qs.get("w") || "375").split(",").map(Number);
const sleep = t => new Promise(r => setTimeout(r, t));

function rgba(s) {
  const m = s.match(/rgba?\(([^)]+)\)/);
  if (!m) return [0, 0, 0, 0];
  const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number);
  return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
}
function lum([r, g, b]) {
  const f = c => (c /= 255) <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
function blend(top, under) {
  const a = top[3];
  return [0, 1, 2].map(i => top[i] * a + under[i] * (1 - a)).concat(1);
}
function background(w, el) {
  const chain = [];
  for (let e = el; e && e.nodeType === 1; e = e.parentElement) chain.push(rgba(w.getComputedStyle(e).backgroundColor));
  let c = [255, 255, 255, 1];
  for (let i = chain.length - 1; i >= 0; i--) if (chain[i][3] > 0) c = blend(chain[i], c);
  return c;
}
function contrast(w, el) {
  const bg = background(w, el), fg = blend(rgba(w.getComputedStyle(el).color), bg);
  const a = lum(fg), b = lum(bg);
  return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
}
const visible = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };

// interactive elements that must be easy to tap on a phone (min px)
const TARGETS = [["#nav a", 44], [".book-tabs a", 44], [".chapter-card", 48], ["#chapter-links a", 48],
                 ["button", 44], ["input[type=search]", 44], ["input[type=text]", 44], ["select", 44]];
// text that must reach 4.5:1 against what is actually behind it
const TEXTS = ["main p", ".verse-text", ".verse-num", ".ch-title", ".ch-count", "footer", "#nav a", "#nav a.active",
               ".book-tabs a", ".book-tabs a.active", "button", ".search-ref", "#results li", "mark", "#result-info",
               ".notes li", ".card-controls label", "select", "input", "h1", "#chapter-links a"];

function measure(f, width) {
  const w = f.contentWindow, d = f.contentDocument, o = {};
  const limit = d.documentElement.clientWidth;
  o.scrollWidth = d.documentElement.scrollWidth;
  o.clientWidth = limit;
  o.overflow = [...d.body.querySelectorAll("*")].filter(e => visible(e) && e.getBoundingClientRect().right > limit + 1)
    .slice(0, 5).map(e => e.tagName.toLowerCase() + (e.id ? "#" + e.id : "") + (e.className && typeof e.className === "string" ? "." + e.className.split(" ")[0] : "") + "→" + Math.round(e.getBoundingClientRect().right));
  o.targets = {};
  for (const [sel, min] of TARGETS) {
    const els = [...d.querySelectorAll(sel)].filter(visible);
    if (!els.length) continue;
    const h = Math.min(...els.map(e => e.getBoundingClientRect().height)), wd = Math.min(...els.map(e => e.getBoundingClientRect().width));
    o.targets[sel] = {min, h: Math.round(h * 10) / 10, w: Math.round(wd * 10) / 10};
  }
  o.contrast = {};
  for (const sel of TEXTS) {
    const els = [...d.querySelectorAll(sel)].filter(visible).slice(0, 30);
    if (els.length) o.contrast[sel] = Math.round(Math.min(...els.map(e => contrast(w, e))) * 100) / 100;
  }
  // keyboard focus: every focusable element must draw a solid outline of at least 2px when focused
  const focusables = [...d.querySelectorAll("a[href], button, input, select, [tabindex]")].filter(visible);
  const seen = {};
  o.focus = [];
  for (const e of focusables) {
    const kind = e.tagName.toLowerCase() + (e.closest("#nav") ? " (nav)" : e.closest(".book-tabs") ? " (book-tabs)" : e.classList.contains("chapter-card") ? " (chapter-card)" : e.closest("#chapter-links") ? " (chapter-links)" : e.closest("#results") ? " (results)" : "");
    if ((seen[kind] = (seen[kind] || 0) + 1) > 3) continue;
    e.focus({preventScroll: true});
    const cs = w.getComputedStyle(e);
    const ok = cs.outlineStyle !== "none" && cs.outlineStyle !== "auto" && parseFloat(cs.outlineWidth) >= 2;
    if (!ok) o.focus.push(`${kind}: ${cs.outlineStyle} ${cs.outlineWidth}`);
  }
  if (d.activeElement) d.activeElement.blur();
  const na = d.querySelector("#nav a.active");
  if (na) { const cs = w.getComputedStyle(na); o.navActive = {bg: cs.backgroundColor, weight: parseInt(cs.fontWeight), bottom: parseFloat(cs.borderBottomWidth)}; }
  // current page / book must be marked by more than colour (bold or underline)
  o.current = {};
  for (const sel of ["#nav a.active", ".book-tabs a.active"]) {
    const e = d.querySelector(sel);
    if (!e) continue;
    const cs = w.getComputedStyle(e);
    o.current[sel] = parseInt(cs.fontWeight) >= 600 || cs.textDecorationLine.includes("underline") || parseFloat(cs.borderBottomWidth) >= 2;
  }
  const h1 = d.querySelector("h1");
  o.h1 = h1 ? parseFloat(w.getComputedStyle(h1).fontSize) : 0;
  const vt = d.querySelector(".verse-text");
  o.verseFont = vt ? parseFloat(w.getComputedStyle(vt).fontSize) : 0;
  // every line of every verse starts at the same left edge (number column and text column)
  o.verseLefts = [...new Set([...d.querySelectorAll(".verse-text")].map(e => Math.round(e.getBoundingClientRect().left)))];
  o.unnamed = [...d.querySelectorAll("input:not([type=hidden]), select")]
    .filter(e => !(e.labels && e.labels.length) && !e.getAttribute("aria-label") && !e.getAttribute("aria-labelledby"))
    .map(e => e.tagName.toLowerCase() + (e.id ? "#" + e.id : e.name ? "[name=" + e.name + "]" : ""));
  const sheet = [...d.styleSheets].find(s => (s.href || "").endsWith("style.css"));
  o.cssRules = sheet ? sheet.cssRules.length : -1;
  o.focusVisibleRules = sheet ? [...sheet.cssRules].filter(r => (r.selectorText || "").includes(":focus-visible")).length : -1;
  const c = d.getElementById("card-canvas");
  if (c) o.canvas = {attrW: c.width, shownW: Math.round(c.getBoundingClientRect().width), ref: c.getAttribute("data-ref") || ""};
  const hero = d.querySelector(".home-hero"), hcard = d.querySelector(".home-card");
  if (hero && hcard) {   // home page: the verse card floats over the bottom edge of the picture
    const hi = hero.querySelector("img"), mb = d.getElementById("music-btn"), kick = d.querySelector(".hero-kicker");
    const mcs = mb ? w.getComputedStyle(mb) : null, kcs = kick ? w.getComputedStyle(kick) : null;
    o.home = {heroH: Math.round(hero.getBoundingClientRect().height), imgBottom: Math.round((hi || hero).getBoundingClientRect().bottom), cardTop: Math.round(hcard.getBoundingClientRect().top),
              musicBg: mcs ? rgba(mcs.backgroundColor) : null, musicLum: mcs ? Math.round(lum(rgba(mcs.color)) * 100) / 100 : null,
              musicInHero: !!mb && hero.contains(mb), musicBottom: mb ? Math.round(mb.getBoundingClientRect().bottom) : null, kickerLum: kcs ? Math.round(lum(rgba(kcs.color)) * 100) / 100 : null, kickerShadow: kcs ? kcs.textShadow : null,
              serif: /Songti|PMingLiU|serif/.test(w.getComputedStyle(d.querySelector(".home-verse")).fontFamily)};
  }
  o.dark = w.matchMedia("(prefers-color-scheme: dark)").matches;
  o.error = !!d.querySelector(".error");
  return o;
}

(async () => {
  const frames = widths.map(width => {
    const f = document.createElement("iframe");
    f.style.cssText = `width:${width}px;height:800px;border:0;display:block`;
    f.src = qs.get("u");
    document.body.appendChild(f);
    return [width, f];
  });
  const ready = d => d && d.readyState === "complete" && (d.querySelector(".chapter-card, .verse-text, #results li, .error, .home-verse") ||
    (d.getElementById("card-canvas") && d.getElementById("card-canvas").getAttribute("data-ref")) ||
    (d.getElementById("result-info") && d.getElementById("result-info").textContent.trim()));
  for (let i = 0; i < 60 && !frames.every(([, f]) => ready(f.contentDocument)); i++) await sleep(150);
  await sleep(400);
  const out = {};
  for (const [width, f] of frames) {
    try { out[width] = measure(f, width); } catch (e) { out[width] = {crash: String(e)}; }
  }
  document.getElementById("out").textContent = "VISUAL " + JSON.stringify(out);
})();
</script>
