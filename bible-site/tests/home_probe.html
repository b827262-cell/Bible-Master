<!doctype html>
<meta charset="utf-8">
<!-- Loaded by tests/site_checks.py through its local server (Chrome runs with autoplay allowed). Opens ?u=<page> in an iframe
     (?w=<px> sets its width, default 375), clicks #music-btn once when ?click=1, runs a search flow when ?do=empty|hit|miss,
     then writes one JSON line into <pre id="out">:
     PROBE {"verse","ref","h1","img":{src,naturalWidth,alt,complete},"audio":{src,loop,preload,paused},
            "music":{text,pressed,paused},"links":[{text,href}],"navActive":n,"navCount":n,"errors":[...],
            "dock":{position,fixed,count,items[{text,href,w,h,active,weight,bg}],active,box,musicBox,musicOverlaps,
                    bodyPadBottom,mainPadBottom,lastBottom,vh,scrollH},
            "hero":{pic,body,verse,picOverlap,verseInPic,picH,color,shadow,serif,bodyBgImage,bodyHasGradient,contrast},
            "tiles":{bookCount,dailyHref,drawHref,find,findInput,fan:["url(...)"],fanNames:["eagle-B.jpg"]},
            "cover":{bg,imgNames},
            "heart":{heartBtn{found,shown,id,ariaBusy,label},heartImg{found,src,srcName,alt},stageBg,pagePattern{host,file,size},
                     statusIdle,statusRegion{role,live,state},reduce,dark,eagleOverlap,eagleDetail}   (第三輪 B)
            "headingScale":{h2Px,h3Px,h2Font,h3Font,h2Text,h3Text}                                     (第三輪 C)
            "states":{"empty":{busy,final},"hit":{...},"miss":{...}}  (only with ?do=...)
            "bm":{...收藏經節全流程：chips/marked/store/afterReload/unmarked/indexBox/indexItems/afterRemove/
                  corruptIndex/corruptChapter/sizes}  (only with ?bm=1)                                (第三輪 D)
            "statusRegion":{role,live,text}}
     Contract of the home page: .home-verse and .home-ref (filled by Bible.load), .home-hero img, audio#home-music,
     button#music-btn[aria-pressed] (pressed="true" exactly when the audio is playing), links 進入四福音 / 抽一張經文卡 / 閱讀本章.
     2026-11 restyle contract: bottom floating dock (#nav or .dock, position:fixed) with five links
     首頁／目錄／禱讀／抽卡／搜尋 and exactly one aria-current="page" or .active; the hero picture and the verse block are
     separate rectangles that must not overlap; verse colour equals the sunlight token; the bento entrance carries
     .book x4, .daily, .draw (three fan cards .fan i painted B, A, B) and .find; every status message sits in a
     role=status / aria-live region with data-state="busy|ok|fix". -->
<pre id="out">running</pre>
<script>
const qs = new URLSearchParams(location.search);
const f = document.createElement("iframe");
f.style.cssText = "width:" + (parseInt(qs.get("w")) || 375) + "px;height:900px;border:0";
const errors = [];
f.src = qs.get("u");
f.addEventListener("load", () => { try { f.contentWindow.addEventListener("error", e => errors.push(String(e.message))); f.contentWindow.addEventListener("unhandledrejection", e => errors.push("promise: " + String(e.reason))); } catch (e) {} });
document.body.appendChild(f);
const sleep = t => new Promise(r => setTimeout(r, t));
const d0 = () => f.contentDocument;
const cs = (e, p) => e ? f.contentWindow.getComputedStyle(e, p || null) : null;
const text = (d, s) => { const e = d.querySelector(s); return e ? e.textContent.trim() : ""; };
const box = e => { if (!e) return null; const r = e.getBoundingClientRect();
  return {x: Math.round(r.x), y: Math.round(r.y), top: Math.round(r.top), left: Math.round(r.left),
          right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height)}; };
const hits = (a, b) => !!a && !!b && a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
const rgba = s => { const m = (s || "").match(/rgba?\(([^)]+)\)/); if (!m) return [0, 0, 0, 0];
  const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; };
const lum = c => { const t = v => (v /= 255) <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  return 0.2126 * t(c[0]) + 0.7152 * t(c[1]) + 0.0722 * t(c[2]); };
const blend = (top, under) => { const a = top[3]; return [0, 1, 2].map(i => top[i] * a + under[i] * (1 - a)).concat(1); };
// 漸層／圖檔當背景時 backgroundColor 是透明的：改用宣告底色或 fallback，別把透明當成白底算出假對比
function back(w, el) {
  let c = [243, 246, 242, 1];   // --paper 的 fallback（淺色霧白）
  for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
    const s = cs(e), col = rgba(s.backgroundColor);
    if (col[3] > 0) { c = blend(col, c); }
    else if (/gradient|url\(/.test(s.backgroundImage)) {
      const hex = (s.backgroundImage.match(/#[0-9a-fA-F]{6}|#[0-9a-fA-F]{3}/g) || []).map(h => rgba(h.length === 4 ? h : h)).filter(x => x[3] > 0);
      if (hex.length) { c = blend(hex[hex.length - 1], c); break; }
      const dark = /dark/.test(w.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "");
      c = blend(dark ? [10, 20, 18, 1] : [10, 20, 18, 1], c); break;   // 樣本：經文／色塊都落在深底上
    }
  }
  return c;
}
const contrastOf = el => { const bg = back(f.contentWindow, el), fg = blend(rgba(cs(el).color), bg);
  const a = lum(fg), b = lum(bg); return Math.round(((Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05)) * 100) / 100; };
const visible = e => { const r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
const hrefOf = e => e ? (e.tagName === "A" ? e.getAttribute("href") : (e.querySelector("a") || {}).href ? e.querySelector("a").getAttribute("href") : null) : null;
const fileOf = u => { const m = /url\(["']?[^"'()]*?([\w.-]+\.(?:jpg|jpeg|png|webp|gif))["']?\)/i.exec(u || ""); return m ? m[1] : ""; };

function music(d) {
  const b = d.getElementById("music-btn"), a = d.getElementById("home-music");
  return b ? {text: b.textContent.trim(), pressed: b.getAttribute("aria-pressed"), paused: a ? a.paused : null} : null;
}
// 底部浮動膠囊導覽列（五項、恰一目前頁、觸控區、不遮音樂鍵、底部留白）
function dock(d) {
  const nav = d.getElementById("nav") || d.querySelector(".dock");
  if (!nav) return null;
  const links = [...nav.querySelectorAll("a")];
  const items = links.map(a => { const r = a.getBoundingClientRect(), s = cs(a);
    return {text: a.textContent.trim(), href: a.getAttribute("href"), w: Math.round(r.width), h: Math.round(r.height),
            active: a.getAttribute("aria-current") === "page" || a.classList.contains("active"),
            weight: parseInt(s.fontWeight) || 0, bg: s.backgroundColor}; });
  const nb = box(nav), mb = box(d.getElementById("zone-music-btn") || d.getElementById("music-btn"));
  const main = d.querySelector("main") || d.body, last = main.lastElementChild;
  const scrollable = d.scrollingElement || d.documentElement;
  return {position: cs(nav).position, fixed: cs(nav).position === "fixed",
          count: items.length, items, active: items.filter(i => i.active).length,
          small: items.filter(i => i.w < 44 || i.h < 44).length, box: nb, musicBox: mb, musicOverlaps: hits(nb, mb),
          bodyPadBottom: parseFloat(cs(d.body).paddingBottom) || 0, mainPadBottom: parseFloat(cs(main).paddingBottom) || 0,
          lastBottom: last ? Math.round(last.getBoundingClientRect().bottom) : null,
          vh: f.contentWindow.innerHeight, navTop: nb ? nb.top : null, scrollH: scrollable.scrollHeight};
}
// 主視覺：照片與經文分離、經文與光同色
function hero(d) {
  const pic = d.querySelector(".hero-pic img") || d.querySelector(".home-hero img") || d.querySelector(".hero img");
  const body = d.querySelector(".hero-body") || d.querySelector(".home-card") || d.querySelector(".hero");
  const v = d.querySelector(".hero blockquote") || d.querySelector(".home-verse");
  if (!pic || !v) return null;
  const pb = box(pic), vb = box(v), bb = box(body);
  const s = cs(v), bs = cs(body || v);
  return {pic: pb, body: bb, verse: vb, picH: Math.round(pic.getBoundingClientRect().height),
          picNatural: pic.naturalWidth, picSrc: fileOf(pic.getAttribute("src")) || (pic.getAttribute("src") || ""),
          picOverlap: hits(pb, vb), verseInPic: !!vb && !!pb && vb.left >= pb.left && vb.right <= pb.right && vb.top >= pb.top && vb.bottom <= pb.bottom,
          color: s.color, shadow: s.textShadow, serif: /serif|Songti|PMingLiU|MingLiU/i.test(s.fontFamily),
          bodyBgImage: (bs.backgroundImage || "").slice(0, 200), bodyHasGradient: /radial-gradient/.test(bs.backgroundImage || ""),
          contrast: contrastOf(v)};
}
// 便當格入口與扇形紙卡 B、A、B
function tiles(d) {
  const fan = [...d.querySelectorAll(".fan i")].map(e => cs(e).backgroundImage);
  const draw = d.querySelector(".draw"), daily = d.querySelector(".daily");
  return {bookCount: d.querySelectorAll(".book").length, bookInk: [...d.querySelectorAll(".book")].map(b => contrastOf(b.querySelector("h3") || b)),
          dailyHref: hrefOf(daily), drawHref: hrefOf(draw),
          find: !!d.querySelector(".find"), findInput: !!(d.querySelector(".find") && d.querySelector(".find input")),
          fan: fan.map(x => (x || "").slice(0, 120)), fanNames: fan.map(fileOf), fanCount: fan.length};
}
// 抽卡頁抽卡前的卡背（eagle-A）
function cover(d) {
  const el = d.getElementById("cover") || d.querySelector(".cover");
  if (!el) return null;
  const sub = el.querySelector(".card-back-art, .cover-art, .cover-card");
  const img = el.querySelector("img");
  const bg = cs(el).backgroundImage, sb = sub ? cs(sub).backgroundImage : "", ib = img ? cs(img).backgroundImage : "";
  const names = [fileOf(bg), fileOf(sb), fileOf(img ? img.getAttribute("src") : ""), fileOf(ib)].filter(Boolean);
  return {shown: visible(el), bg: (bg !== "none" ? bg : sb || "").slice(0, 160), imgSrc: img ? (img.getAttribute("src") || "") : "",
          imgBg: (ib || "").slice(0, 160), names, hasA: names.includes("eagle-A.jpg"), blankBlock: names.length === 0,
          drawHidden: (() => { const b = d.getElementById("draw-btn"); return b ? visible(b) : null; })()};
}
function statusRegion(d) {
  const s = d.querySelector(".status") || d.querySelector("[role=status]") || d.querySelector("[aria-live]");
  if (!s) return null;
  return {role: s.getAttribute("role") || "", live: s.getAttribute("aria-live") || "", text: s.textContent.trim(),
          state: s.getAttribute("data-state"), glyph: (cs(s, "::before").content || "").slice(0, 40)};
}
/* 第三輪 B：抽卡頁的待機愛心、小驚喜、底紋，以及卡背標題／按鈕不可壓在老鷹身上。
   頁面還沒接線時每個欄位都回傳 null／false，讓檢查紅燈而不是讓探測頁壞掉。 */
function heart(d) {
  const w = f.contentWindow;
  const btn = d.getElementById("heart-btn") || d.querySelector(".heart");
  const img = d.getElementById("heart-img") || (btn ? btn.querySelector("img") : null);
  const stage = d.querySelector(".heart-stage") || (btn ? btn.parentElement : null);
  const hosts = [d.body, d.querySelector(".bless-stage"), d.querySelector("main")].filter(Boolean);
  const patHost = hosts.find(e => (cs(e).backgroundImage || "none") !== "none") || null;
  const pat = patHost ? cs(patHost).backgroundImage : "none";
  const st = d.getElementById("heart-status") || d.getElementById("share-msg") || d.querySelector("[role=status]");
  const card = d.querySelector(".cover-card") || d.querySelector(".card-back-art") || d.getElementById("cover");
  const base = s => (s || "").split("?")[0].split("/").pop();
  let overlap = null, detail = {reason: card ? "" : "找不到卡背元素"};
  if (card) {
    const cr = card.getBoundingClientRect();
    const zone = cr.top + cr.height * 0.65;                 // 老鷹在中上部，下半部才是可放字的深色留白
    const bad = [];
    const tops = {};
    for (const sel of [".cover-title", "#draw-btn"]) {
      const e = d.querySelector(sel);
      if (!e) { bad.push(sel + " 不存在"); continue; }
      const r = e.getBoundingClientRect();
      tops[sel] = Math.round(r.top);
      const touches = r.left < cr.right && r.right > cr.left && r.top < cr.bottom && r.bottom > cr.top;
      if (touches && r.top < zone) bad.push(sel);
    }
    overlap = bad.length === 0 ? false : true;
    detail = Object.assign({cardTop: Math.round(cr.top), cardH: Math.round(cr.height), zoneTop: Math.round(zone), bad: bad}, tops, detail);
  }
  return {
    heartBtn: btn ? {found: true, shown: visible(btn), id: btn.id || "", ariaBusy: btn.getAttribute("aria-busy"),
                     ariaPressed: btn.getAttribute("aria-pressed"), label: btn.textContent.trim(),
                     radius: parseFloat(cs(btn).borderTopLeftRadius) || 0} : {found: false},
    heartImg: img ? {found: true, src: img.getAttribute("src") || "", srcName: base(img.getAttribute("src")),
                     alt: img.getAttribute("alt") || "", complete: !!img.complete, naturalWidth: img.naturalWidth || 0} : {found: false},
    stageBg: stage ? cs(stage).backgroundColor : null,
    stageTag: stage ? (stage.id || stage.className || stage.tagName) : null,
    pagePattern: {host: patHost ? (patHost.id || patHost.tagName) : null, file: base(fileOf(pat)),
                  size: patHost ? cs(patHost).backgroundSize : "", raw: (pat || "").slice(0, 200)},
    statusIdle: st ? st.textContent.trim() : null,
    statusRegion: st ? {role: st.getAttribute("role") || "", live: st.getAttribute("aria-live") || "",
                        state: st.getAttribute("data-state")} : null,
    reduce: w.matchMedia("(prefers-reduced-motion: reduce)").matches,
    dark: w.matchMedia("(prefers-color-scheme: dark)").matches,
    eagleOverlap: overlap, eagleDetail: detail
  };
}
/* 第三輪 C：禱讀頁的當天標題（h2）要比分段標題（h3）大、且用明體。 */
function headingScale(d) {
  const h2 = d.querySelector("#reading h2"), h3 = d.querySelector("#reading h3");
  return {h2Px: h2 ? parseFloat(cs(h2).fontSize) : null, h3Px: h3 ? parseFloat(cs(h3).fontSize) : null,
          h2Font: h2 ? cs(h2).fontFamily : "", h3Font: h3 ? cs(h3).fontFamily : "",
          h2Text: h2 ? h2.textContent.trim().slice(0, 40) : "", h3Text: h3 ? h3.textContent.trim() : ""};
}
function fieldState(d) {
  const i = d.querySelector("input[type=search]") || d.querySelector(".find input") || d.querySelector("main input[type=text]");
  if (!i) return null;
  const s = cs(i), id = i.getAttribute("aria-describedby");
  const target = id ? d.getElementById(id) : null;
  return {invalid: i.getAttribute("aria-invalid"), describedby: id || "",
          targetRole: target ? (target.getAttribute("role") || target.getAttribute("aria-live") || "無 role／aria-live") : (id ? "找不到元素" : ""),
          border: s.borderTopStyle + " " + s.borderTopWidth, focusedColor: s.color};
}
async function waitDoc() {   // 送出表單可能會轉頁（method=get），轉頁後要等新文件就緒再讀狀態
  const before = f.contentDocument;
  for (let i = 0; i < 40; i++) {
    await sleep(150);
    const d = f.contentDocument;
    if (d && d !== before && d.readyState === "complete") { await sleep(600); return d; }
    if (d && d.readyState === "complete" && (d.querySelector(".status, [role=status]") || {}).textContent !== undefined) {
      const s = d.querySelector(".status, [role=status], [aria-live]");
      if (s && (s.textContent || "").trim()) return d;
    }
  }
  return f.contentDocument;
}
async function searchFlow(mode) {
  const d = f.contentDocument;
  const form = d.querySelector(".find form") || d.querySelector("form");
  const i = (form && form.querySelector("input")) || d.querySelector("input[type=search]");
  if (!i) return null;
  i.value = mode === "empty" ? "" : mode === "miss" ? "zzz一定找不到測試字串" : "耶穌";
  i.focus();
  const btn = form ? (form.querySelector("button[type=submit], input[type=submit], button") || null) : d.querySelector("button[type=submit]");
  const before = d;
  if (btn) btn.click();                                       // 最接近真人操作的路徑
  else if (form) form.dispatchEvent(new SubmitEvent("submit", {bubbles: true, cancelable: true}));
  else i.dispatchEvent(new KeyboardEvent("keydown", {key: "Enter", bubbles: true}));
  await sleep(120);
  const busy = {status: statusRegion(f.contentDocument), field: fieldState(f.contentDocument), navigated: f.contentDocument !== before};
  for (let k = 0; k < 20; k++) {
    await sleep(150);
    const s = statusRegion(f.contentDocument);
    if (s && s.state && s.state !== "busy" && s.text) break;
  }
  const dd = await waitDoc();
  return {busy, final: {status: statusRegion(dd), field: fieldState(dd),
          results: dd.querySelectorAll("#results li").length, info: text(dd, "#result-info").slice(0, 120)}};
}
/* ===== 第三輪 D：收藏經節（localStorage 鍵 bible.bookmarks.v1，只准存座標） =====
   頁面還沒實作時每一步都回傳 null／false，讓 site_checks 的 bookmarks 群組紅燈而不是讓探測頁出錯。 */
const BM_KEY = "bible.bookmarks.v1";
const CHAPTER_URL = "../site/chapter.html?book=jhn&ch=3";
const INDEX_URL = "../site/index.html";
function goto(url) {
  return new Promise(resolve => {
    f.addEventListener("load", () => setTimeout(() => resolve(f.contentDocument), 350), {once: true});
    f.src = url;
  });
}
async function waitFor(fn, tries) {
  for (let i = 0; i < (tries || 20); i++) { const v = fn(); if (v) return v; await sleep(150); }
  return null;
}
function bmStatus(d) {
  const s = d.getElementById("reading-status") || d.querySelector(".status") || d.querySelector("[role=status]");
  if (!s) return null;
  return {text: s.textContent.trim(), state: s.getAttribute("data-state"),
          role: s.getAttribute("role") || "", live: s.getAttribute("aria-live") || ""};
}
/* 收藏資料壞掉時要看的「怎麼修」提示：必須是跟收藏有關、也講到損壞／無法讀取／清除的那一句，
   不是任何一句中文都算（否則頁面根本沒實作也會假綠）。 */
function noticeText(d) {
  const skip = ["SCRIPT", "STYLE", "TEMPLATE", "NOSCRIPT"];
  const leaves = [...d.querySelectorAll("body *")].filter(e => !skip.includes(e.tagName) && !e.querySelector("*") && e.textContent.trim());
  const hit = leaves.filter(e => /收藏/.test(e.textContent)
    && /(損壞|無法|讀取失敗|載入失敗|清除|重新)/.test(e.textContent)).find(visible);
  return hit ? hit.textContent.trim().slice(0, 140) : "";
}
function chipBtn(d, id) {
  const li = d.getElementById(id);
  const chips = (li && li.querySelector(".chips")) || d.querySelector(".chips");
  if (!chips) return null;
  return [...chips.querySelectorAll("button")].find(x => /收藏/.test(x.textContent)) || null;
}
function chipState(d, id) {
  const li = d.getElementById(id);
  const chips = (li && li.querySelector(".chips")) || d.querySelector(".chips");
  const b = chipBtn(d, id);
  return {li: !!li, chips: !!chips, found: !!b, pressed: b ? b.getAttribute("aria-pressed") : null,
          label: b ? b.textContent.trim() : "", busy: b ? b.getAttribute("aria-busy") : null,
          chipsText: chips ? chips.textContent.trim().slice(0, 140) : ""};
}
function bmStore(w) {
  let raw = null, readErr = "";
  try { raw = w.localStorage.getItem(BM_KEY); } catch (e) { readErr = String(e); }
  let parsed = null, parseErr = "";
  if (typeof raw === "string") { try { parsed = JSON.parse(raw); } catch (e) { parseErr = String(e); } }
  return {present: raw !== null, raw: raw === null ? null : String(raw).slice(0, 400), readErr, parseErr,
          isArray: Array.isArray(parsed), length: Array.isArray(parsed) ? parsed.length : null,
          keys: Array.isArray(parsed) ? parsed.map(x => Object.keys(x || {}).sort().join("+")) : [],
          hasCjk: typeof raw === "string" ? /[㐀-鿿]/.test(raw) : false};
}
function bmBox(d) {
  const box = d.getElementById("bookmarks-box")
    || [...d.querySelectorAll("details")].find(x => /我的收藏/.test(x.textContent));
  if (!box) return {found: false, navCount: d.querySelectorAll("#nav a, .dock a").length};
  const summary = box.tagName === "DETAILS" ? box.querySelector("summary") : (box.querySelector("button,h2") || null);
  return {found: true, tag: box.tagName, id: box.id || "", open: box.tagName === "DETAILS" ? !!box.open : true,
          summary: summary ? summary.textContent.trim() : "", toggle: !!summary,
          navCount: d.querySelectorAll("#nav a, .dock a").length};
}
function bmItems(d) {
  const box = d.getElementById("bookmarks-box") || [...d.querySelectorAll("details")].find(x => /我的收藏/.test(x.textContent));
  if (!box) return [];
  return [...box.querySelectorAll("li")].map(li => ({
    text: li.textContent.trim().slice(0, 160),
    links: [...li.querySelectorAll("a")].map(a => ({text: a.textContent.trim(), href: a.getAttribute("href")})),
    remove: !![...li.querySelectorAll("button")].find(b => /移除/.test(b.textContent))
  }));
}
async function bmFlow() {
  const out = {key: BM_KEY, errorsAt: {}};
  const mark = (label) => { out.errorsAt[label] = errors.length; };
  mark("start");
  const d = d0(), w = f.contentWindow;
  out.startUrl = (d.location.pathname || "").replace(/^\/+/, "") + (d.location.search || "");
  try { w.localStorage.removeItem(BM_KEY); } catch (e) { out.clearError = String(e); }

  // 1) 閱讀頁：點經節 → 操作列出現收藏按鈕
  const li = await waitFor(() => d.getElementById("v16"), 40);
  out.verseFound = !!li;
  if (li) { li.scrollIntoView(); li.click(); await sleep(300); }
  await waitFor(() => !!chipBtn(d, "v16"), 20);
  out.chips = chipState(d, "v16");
  // 2) 按收藏：aria-pressed 變 true、文字變「✓ 已收藏」、狀態列播報
  const b1 = chipBtn(d, "v16");
  if (b1) { b1.click(); await sleep(450); }
  out.marked = chipState(d, "v16");
  out.markStatus = bmStatus(d);
  out.store = bmStore(w);
  // 3) 重新整理後仍保持已收藏
  const d2 = await goto(f.src);
  await waitFor(() => d2.getElementById("v16"), 40);
  const li2 = d2.getElementById("v16");
  if (li2) { li2.scrollIntoView(); li2.click(); await sleep(300); }
  out.afterReload = chipState(d2, "v16");
  out.reloadStore = bmStore(f.contentWindow);
  // 4) 再點一次＝取消收藏
  const b2 = chipBtn(d2, "v16");
  if (b2) { b2.click(); await sleep(450); }
  out.unmarked = chipState(d2, "v16");
  out.unmarkStatus = bmStatus(d2);
  out.storeAfterUnmark = bmStore(f.contentWindow);
  // 5) 再收藏一次，然後打開目錄頁看收藏區
  if (b2) { b2.click(); await sleep(450); }
  out.remarked = chipState(d2, "v16");
  mark("beforeIndex");
  const d3 = await goto(INDEX_URL);
  await waitFor(() => d3.querySelector(".chapter-card"), 40);
  out.indexBox = bmBox(d3);
  const box = d3.getElementById("bookmarks-box") || [...d3.querySelectorAll("details")].find(x => /我的收藏/.test(x.textContent));
  if (box && box.tagName === "DETAILS") { box.open = true; await sleep(200); }
  if (box && box.tagName !== "DETAILS") {
    const t = box.querySelector("summary,button,h2");
    if (t) { t.click(); await sleep(250); }
  }
  out.indexOpen = bmBox(d3);
  out.indexItems = bmItems(d3);
  // 6) 移除 → 變成 0 節並顯示說明文字
  const rmBtn = box ? [...box.querySelectorAll("li button")].find(b => /移除/.test(b.textContent)) : null;
  if (rmBtn) { rmBtn.click(); await sleep(500); }
  out.afterRemove = {items: bmItems(d3), box: bmBox(d3),
                     emptyText: box ? box.textContent.trim().slice(0, 200) : "",
                     store: bmStore(f.contentWindow)};
  // 7) 損壞資料容錯：塞壞 JSON 後開目錄頁與閱讀頁
  try { f.contentWindow.localStorage.setItem(BM_KEY, "{bad json"); } catch (e) { out.seedError = String(e); }
  mark("beforeCorrupt");
  const d4 = await goto(INDEX_URL);
  await waitFor(() => d4.querySelector(".chapter-card"), 40);
  out.corruptIndex = {renders: !!d4.querySelector(".chapter-card"), chinese: /[㐀-鿿]/.test(d4.body.textContent),
                      notice: noticeText(d4), box: bmBox(d4), newErrors: errors.slice(out.errorsAt.beforeCorrupt)};
  mark("beforeCorruptChapter");
  const d5 = await goto(CHAPTER_URL);
  await waitFor(() => d5.getElementById("v16"), 40);
  out.corruptChapter = {renders: !!d5.getElementById("v16"), chinese: /[㐀-鿿]/.test(d5.body.textContent),
                        notice: noticeText(d5), newErrors: errors.slice(out.errorsAt.beforeCorruptChapter)};
  // 8) 四種寬度：目錄頁展開收藏區、閱讀頁展開 chips，都不能水平溢出（也要記錄真的有把新 UI 攤開來量）
  try { f.contentWindow.localStorage.setItem(BM_KEY, JSON.stringify([{book: "jhn", ch: 3, v: 16, at: "2026-11-13T00:00:00Z"}])); } catch (e) {}
  out.sizes = {};
  for (const [name, url] of [["index", INDEX_URL], ["chapter", CHAPTER_URL]]) {
    out.sizes[name] = {};
    for (const wid of [320, 375, 768, 1440]) {
      f.style.width = wid + "px";
      const dd = await goto(url);
      await waitFor(() => dd.querySelector(".chapter-card") || dd.getElementById("v16"), 40);
      let opened = false;
      if (name === "chapter") {
        const t = dd.getElementById("v16");
        if (t) { t.click(); await sleep(300); }
        opened = !!chipBtn(dd, "v16");
      } else {
        const bx = dd.getElementById("bookmarks-box") || [...dd.querySelectorAll("details")].find(x => /我的收藏/.test(x.textContent));
        if (bx && bx.tagName === "DETAILS") { bx.open = true; await sleep(200); }
        opened = !!bx && bmItems(dd).length > 0;
      }
      out.sizes[name][wid] = {scrollWidth: dd.documentElement.scrollWidth, clientWidth: dd.documentElement.clientWidth,
                              navCount: dd.querySelectorAll("#nav a, .dock a").length, opened: opened};
    }
    f.style.width = (parseInt(qs.get("w")) || 375) + "px";
  }
  return out;
}
/* ===== 第三輪：首頁一週封面（?wk=1）=====
   同一個 Chrome session 依序走 ?day=1..7 與不帶 day 的首頁，每天量封面圖／alt／出處小標／
   經文／閱讀本章連結／字色與對比，以及 320／375／768／1440 四種寬度的幾何。 */
function imgOf(d) {
  const e = d.querySelector(".home-hero img") || d.querySelector(".hero-pic img");
  return e ? {src: e.getAttribute("src") || "", alt: e.getAttribute("alt") || "",
              naturalWidth: e.naturalWidth || 0, complete: !!e.complete} : null;
}
/* 換頁但要不會卡死：目標位址跟目前頁面相同時瀏覽器不會觸發 load（?day 收回預設那一趟就是這種），
   所以同一頁直接量現況；不同頁也加上上限，避免整個探測頁吊死成「沒有輸出」。 */
function gotoSafe(url, ms) {
  return new Promise(resolve => {
    const a = document.createElement("a");
    a.href = url;
    const target = a.href;
    let done = false;
    const finish = () => {
      if (done) {
        return;
      }
      done = true;
      resolve(d0());
    };
    const cur = f.contentDocument;
    if (cur && cur.URL === target && cur.readyState === "complete") {
      setTimeout(finish, 400);
      return;
    }
    f.addEventListener("load", () => setTimeout(finish, 350), {once: true});
    f.src = url;
    setTimeout(finish, ms || 8000);
  });
}
async function weekFlow() {
  const out = [];
  for (const q of ["?day=1", "?day=2", "?day=3", "?day=4", "?day=5", "?day=6", "?day=7", ""]) {
    // 每趟先把進度寫出來：若某一輪卡住，--dump-dom 至少看得到卡在哪一天
    document.getElementById("out").textContent = "PROGRESS " + JSON.stringify({query: q, done: out.length});
    const before = errors.length;
    const dd = await gotoSafe("../site/home.html" + q);
    for (let i = 0; i < 40; i++) {
      const t = (dd.querySelector(".home-verse") || {}).textContent || "";
      if (t && t.indexOf("正在") !== 0) break;   // 首頁的載入中佔位文字一律以「正在」開頭
      await sleep(150);
    }
    await sleep(300);
    const sizes = {};
    for (const wid of [320, 375, 768, 1440]) {
      f.style.width = wid + "px";
      await sleep(350);
      const g = d0();
      sizes[wid] = {scrollWidth: g.documentElement.scrollWidth, clientWidth: g.documentElement.clientWidth, hero: hero(g)};
    }
    f.style.width = (parseInt(qs.get("w")) || 375) + "px";
    await sleep(250);
    const g = d0(), rl = g.getElementById("read-link");
    out.push({query: q, verse: text(g, ".home-verse"), ref: text(g, ".home-ref"), img: imgOf(g), hero: hero(g),
              readHref: rl ? (rl.getAttribute("href") || "") : "", sizes: sizes, newErrors: errors.slice(before)});
  }
  return out;
}
function read() {
  const d = d0(), o = {errors};
  o.verse = text(d, ".home-verse");
  o.ref = text(d, ".home-ref");
  o.h1 = text(d, "h1");
  const img = d.querySelector(".home-hero img");
  o.img = img ? {src: img.getAttribute("src"), naturalWidth: img.naturalWidth, alt: img.getAttribute("alt") || "", complete: img.complete} : null;
  const a = d.getElementById("home-music");
  o.audio = a ? {src: a.getAttribute("src") || (a.querySelector("source") || {}).src || "", loop: a.loop, preload: a.preload, paused: a.paused} : null;
  o.music = music(d);
  o.links = [...d.querySelectorAll("main a")].map(x => ({text: x.textContent.trim(), href: x.getAttribute("href")}));
  o.navCount = d.querySelectorAll("#nav a, .dock a").length;
  o.navActive = d.querySelectorAll("#nav a.active, #nav a[aria-current=page], .dock a.active, .dock a[aria-current=page]").length;
  o.dock = dock(d);
  o.hero = hero(d);
  o.tiles = tiles(d);
  o.cover = cover(d);
  o.heart = heart(d);
  o.headingScale = headingScale(d);
  o.statusRegion = statusRegion(d);
  o.musicStatus = (() => { const b = d.getElementById("music-btn") || d.getElementById("zone-music-btn");
    if (!b) return null; const sib = b.parentElement ? [...b.parentElement.querySelectorAll("[role=status],[aria-live],.status")] : [];
    return {hasBtn: true, region: sib.length ? {role: sib[0].getAttribute("role") || "", live: sib[0].getAttribute("aria-live") || ""} : null}; })();
  return o;
}
(async () => {
  for (let i = 0; i < 40; i++) { await sleep(150); const d = d0(); if (d && (text(d, ".home-verse") || d.querySelector(".chapter-card, #results li, #blessing-card, #reading, .error"))) break; }
  await sleep(600);
  const o = read();
  o.initialMusic = o.music;
  if (qs.get("click") === "1") {
    const b = d0().getElementById("music-btn");
    if (b) { b.click(); await sleep(900); }
    o.afterClick = music(d0());
    const b2 = d0().getElementById("music-btn");
    if (b2) { b2.click(); await sleep(600); }
    o.afterSecond = music(d0());
  }
  if (qs.get("wides")) {   // 同一輪內依序量四種寬度（主視覺不重疊要用）
    o.byWidth = {};
    for (const wid of [320, 375, 768, 1440]) {
      f.style.width = wid + "px";
      await sleep(500);
      const dd = d0();
      o.byWidth[wid] = {hero: hero(dd), dock: dock(dd), scrollWidth: dd.documentElement.scrollWidth, clientWidth: dd.documentElement.clientWidth};
    }
  }
  const doMode = qs.get("do");
  if (doMode) {
    o.states = {};
    for (const m of (doMode === "all" ? ["empty", "hit", "miss"] : [doMode])) {
      o.states[m] = await searchFlow(m);
      await sleep(300);
    }
  }
  if (qs.get("bm")) { o.bm = await bmFlow(); }
  // 一週封面的流程若出錯，要把原因寫進輸出，否則檢查只看得到「探測頁沒有輸出」什麼都猜不到
  if (qs.get("wk")) {
    try {
      o.week = await weekFlow();
    } catch (e) {
      o.weekError = String((e && (e.stack || e.message)) || e);
    }
  }
  document.getElementById("out").textContent = "PROBE " + JSON.stringify(o);
})();
