<!doctype html>
<meta charset="utf-8">
<!-- Loaded by tests/site_checks.py through its local server: opens chapter.html?ch=1#v40 in a 375x600 iframe
     and reports whether verse 40 was scrolled into the viewport (verses are rendered after a fetch, so the
     page itself has to do the jump). -->
<pre id="out">running</pre>
<script>
const f = document.createElement("iframe");
f.style.cssText = "width:375px;height:600px;border:0";
f.src = "../site/chapter.html?ch=1#v40";
document.body.appendChild(f);
let tries = 0;
const t = setInterval(() => {
  const d = f.contentDocument, el = d && d.getElementById("v40");
  if (!el && ++tries < 40) return;
  setTimeout(() => {
    clearInterval(t);
    if (!el) { document.getElementById("out").textContent = "ANCHOR 不通過 找不到 #v40"; return; }
    const top = Math.round(el.getBoundingClientRect().top);
    document.getElementById("out").textContent = "ANCHOR " + (top >= 0 && top < 600 ? "OK" : "FAIL") + " top=" + top;
  }, 800);
}, 150);
</script>
