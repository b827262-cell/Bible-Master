<!doctype html>
<meta charset="utf-8">
<!-- Loaded by tests/site_checks.py through its local server: opens chapter.html?...#id in a 375x600 iframe
     and reports whether verse 40 was scrolled into the viewport (verses are rendered after a fetch, so the
     page itself has to do the jump). -->
<pre id="out">running</pre>
<script>
const f = document.createElement("iframe");
f.style.cssText = "width:375px;height:600px;border:0";
const qs = new URLSearchParams(location.search);
const vid = qs.get("id") || "v40";
f.src = qs.get("u") || "../site/chapter.html?book=mrk&ch=1#v40";
document.body.appendChild(f);
let tries = 0;
const t = setInterval(() => {
  const d = f.contentDocument, el = d && d.getElementById(vid);
  if (!el && ++tries < 40) return;
  setTimeout(() => {
    clearInterval(t);
    if (!el) { document.getElementById("out").textContent = "ANCHOR 不通過 找不到 #" + vid + ""; return; }
    const top = Math.round(el.getBoundingClientRect().top);
    document.getElementById("out").textContent = "ANCHOR " + (top >= 0 && top < 600 ? "OK" : "FAIL") + " top=" + top;
  }, 800);
}, 150);
</script>
