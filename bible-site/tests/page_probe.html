<!doctype html>
<meta charset="utf-8">
<!-- Loaded by tests/site_checks.py through its local server. Opens ?u=<page> in an iframe, optionally performs ?act=<json>
     (a list of {id, value}: set a <select> value and fire "change"), then writes one JSON line into <pre id="out">:
     PROBE {"cards":..,"last":..,"tabs":..,"selects":{id:{value,options}},"ref":..}
     The card page must put the drawn reference into canvas#card-canvas[data-ref] so the picture can be checked as text. -->
<pre id="out">running</pre>
<script>
const qs = new URLSearchParams(location.search);
const f = document.createElement("iframe");
f.style.cssText = "width:1000px;height:700px;border:0";
f.src = qs.get("u");
document.body.appendChild(f);
const acts = JSON.parse(qs.get("act") || "[]");
const sleep = t => new Promise(r => setTimeout(r, t));
function read() {
  const d = f.contentDocument, o = {};
  o.cards = d.querySelectorAll(".chapter-card").length;
  const last = d.querySelector(".chapter-card:last-child");
  o.last = last ? last.textContent.trim() : "";
  o.tabs = [...d.querySelectorAll("#book-tabs a")].map(a => a.textContent.trim() + (a.classList.contains("active") ? "*" : "")).join("|");
  o.selects = {};
  d.querySelectorAll("select").forEach(s => { o.selects[s.id || s.name] = {value: s.value, options: s.options.length, values: [...s.options].slice(0, 6).map(x => x.value).join(",")}; });
  const c = d.getElementById("card-canvas");
  o.ref = c ? (c.getAttribute("data-ref") || "") : "";
  return o;
}
(async () => {
  for (let i = 0; i < 40; i++) { await sleep(150); const d = f.contentDocument; if (d && (d.querySelector(".chapter-card") || (d.getElementById("card-canvas") && d.getElementById("card-canvas").getAttribute("data-ref")) || d.querySelector(".error"))) break; }
  await sleep(300);
  for (const a of acts) {
    const s = f.contentDocument.getElementById(a.id);
    if (!s) continue;
    s.value = a.value; s.dispatchEvent(new Event("change", {bubbles: true}));
    await sleep(500);
  }
  document.getElementById("out").textContent = "PROBE " + JSON.stringify(read());
})();
</script>
