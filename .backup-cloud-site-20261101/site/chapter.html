<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>馬可福音 逐章閱讀</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav" aria-label="主要導覽"></nav>
<main>
  <h1 id="title">馬可福音</h1>
  <p class="lede" id="lede">正在載入經文…</p>
  <div id="chapter"><p class="lede">正在載入經文…</p></div>
  <div id="notes-wrap"></div>
  <nav class="pager" id="pager" aria-label="章節切換"></nav>
</main>
<footer>經文來源：和合本馬可福音（由驗證過的資料檔載入）。</footer>
<script src="app.js"></script>
<script>
(function () {
  "use strict";
  var MAX_CH = 16;
  Bible.nav("chapter");

  var raw = parseInt(Bible.param("ch"), 10);
  var ch = (raw >= 1 && raw <= MAX_CH) ? raw : 1;

  document.title = "馬可福音 第 " + ch + " 章";

  var host = document.getElementById("chapter");
  var notesWrap = document.getElementById("notes-wrap");
  var pager = document.getElementById("pager");

  Bible.load().then(function (data) {
    var c = Bible.chapterOf(data, ch) || data.chapters[0];

    document.getElementById("title").textContent = "馬可福音 第 " + c.ch + " 章";
    document.getElementById("lede").textContent =
      "共 " + c.verses.length + " 節・" + data.version;

    var list = document.createElement("ol");
    list.className = "verses";
    c.verses.forEach(function (v) {
      var li = document.createElement("li");
      li.id = "v" + v.v;

      var num = document.createElement("span");
      num.className = "vnum";
      num.textContent = v.v;

      var text = document.createElement("span");
      text.className = "vtext";
      text.textContent = v.text;

      li.appendChild(num);
      li.appendChild(text);
      list.appendChild(li);
    });

    host.textContent = "";
    host.appendChild(list);

    if (c.notes && c.notes.length) {
      var box = document.createElement("div");
      box.className = "notes";
      var h = document.createElement("h2");
      h.textContent = "參照";
      var ul = document.createElement("ul");
      c.notes.forEach(function (n) {
        var li = document.createElement("li");
        li.textContent = n;
        ul.appendChild(li);
      });
      box.appendChild(h);
      box.appendChild(ul);
      notesWrap.appendChild(box);
    }

    pager.textContent = "";
    if (c.ch > 1) {
      var prev = document.createElement("a");
      prev.href = "chapter.html?ch=" + (c.ch - 1);
      prev.textContent = "← 第 " + (c.ch - 1) + " 章";
      pager.appendChild(prev);
    } else {
      var noPrev = document.createElement("span");
      noPrev.textContent = "← 上一章";
      pager.appendChild(noPrev);
    }

    var index = document.createElement("a");
    index.href = "index.html";
    index.textContent = "目錄";
    pager.appendChild(index);

    if (c.ch < MAX_CH) {
      var next = document.createElement("a");
      next.href = "chapter.html?ch=" + (c.ch + 1);
      next.textContent = "第 " + (c.ch + 1) + " 章 →";
      pager.appendChild(next);
    } else {
      var noNext = document.createElement("span");
      noNext.textContent = "下一章 →";
      pager.appendChild(noNext);
    }
  }).catch(function (err) {
    Bible.fail(host, err);
    document.getElementById("lede").textContent = "";
  });
})();
</script>
</body>
</html>
